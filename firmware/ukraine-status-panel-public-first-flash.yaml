                  if (id(ui_language) == 0U) return std::string(usp_sound_controls_text::label(id(ui_language), usp_sound_controls_text::Label::BUZZER_TEST));
                  if (id(ui_language) == 1U) return std::string(usp_sound_controls_text::label(id(ui_language), usp_sound_controls_text::Label::BUZZER_TEST));
                  return std::string(usp_sound_controls_text::label(id(ui_language), usp_sound_controls_text::Label::BUZZER_TEST));

  - id: refresh_optional_hardware_ui
    mode: restart
    then:
      - if:
          condition:
            lvgl.page.is_showing:
              id: page_diagnostics
          then:
            - lvgl.label.update:
                id: diag_sht4x_value_label
                text: !lambda |-
                  if (!id(environment_sht4x).detected()) {
                    return std::string(usp_optional_hardware_text::label(
                        id(ui_language),
                        usp_optional_hardware_text::Status::NOT_FOUND));
                  }
                  const float t = id(environment_temperature).state;
                  const float h = id(environment_humidity).state;
                  if (!std::isfinite(t) || !std::isfinite(h)) {
                    return std::string(usp_optional_hardware_text::label(
                        id(ui_language),
                        usp_optional_hardware_text::Status::STARTING));
                  }
                  char value[48];
                  snprintf(value, sizeof(value), "%.1f°C / %.0f%%", t, h);
                  return std::string(value);
            - if:
                condition:
                  lambda: return id(environment_sht4x).detected();
                then:
                  - lvgl.label.update:
                      id: diag_sht4x_value_label
                      text_color: 0x4ADE80
                else:
                  - lvgl.label.update:
                      id: diag_sht4x_value_label
                      text_color: 0x90A4B8

