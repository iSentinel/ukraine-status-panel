  - id: refresh_selected_neptun_ui
    mode: restart
    then:
      - delay: 1ms
      - lvgl.label.update:
          id: selected_neptun_value
          text: !lambda |-
            if (!id(neptun_client).alerts_valid()) {
              return std::string("--");
            }
            const uint8_t level = id(neptun_client).region_alert_level(
                id(ui_selected_region_id));
            const bool cached = id(neptun_client).alerts_stale()
                || !id(neptun_client).alerts_last_fetch_ok();
            std::string value;
            if (level == 2U) {
              value = usp_neptun_status_text::label(id(ui_language), usp_neptun_status_text::Label::AIR_ALERT);
            } else if (level == 1U) {
              value = usp_neptun_status_text::label(id(ui_language), usp_neptun_status_text::Label::AIR_THREAT);
            } else {
              value = usp_neptun_status_text::label(id(ui_language), usp_neptun_status_text::Label::NO_ACTIVE);
            }
            if (cached) {
              value += usp_neptun_status_text::label(id(ui_language), usp_neptun_status_text::Label::CACHED_SUFFIX);
            }

            const auto counts = id(neptun_client).region_threat_counts(
                id(ui_selected_region_id));
            if (id(neptun_client).valid() && counts.total > 0U) {
              value += "\n";
              unsigned shown = 0U;
              unsigned kinds = 0U;
              const auto append = [&](const char *name, uint16_t count) {
                if (count == 0U) return;
                ++kinds;
                if (shown >= 3U) return;
                if (shown > 0U) value += " ";
                value += name;
                value += usp_ui::unsigned_decimal(count);
                ++shown;
              };
              append(id(ui_language) == 2 ? "UAV" : "БПЛА", counts.uav);
              append("FPV", counts.fpv);
              append(usp_neptun_status_text::label(id(ui_language), usp_neptun_status_text::Label::RECON), counts.recon);
              append(id(ui_language) == 2 ? "MSL" : "РКТ", counts.missile);
              append("BAL", counts.ballistic);
              append("KAB", counts.kab);
              append("MiG", counts.mig31k);
              append("?", counts.unknown);
              if (kinds > shown) {
                value += " +";
                value += usp_ui::unsigned_decimal(kinds - shown);
              }
            }
            return value;
      - lambda: |-
          uint32_t color = 0x90A4B8U;
          if (id(neptun_client).alerts_valid()) {
            uint32_t semantic_color = 0x1F8A4CU;
            if (id(neptun_client).alerts_stale()
                || !id(neptun_client).alerts_last_fetch_ok()) {
              semantic_color = 0xF97316U;
            } else {
              const auto snapshot = id(neptun_client).snapshot();
              const uint8_t state = usp_alert_source::region_state(
                  snapshot, id(ui_selected_region_id), millis(),
                  id(neptun_client).stale_after_ms(),
                  esphome::usp_neptun::region_alert_index);
              semantic_color = usp_dashboard_map_cache::region_color_hex(state, 0);
            }
            color = usp_alert_palette::color_hex(
                semantic_color, id(ui_alert_palette));
          }
          lv_obj_set_style_text_color(
              id(selected_neptun_value), lv_color_hex(color), LV_PART_MAIN);

  - id: schedule_fullscreen_threat_icons_refresh
    mode: restart
    then:
