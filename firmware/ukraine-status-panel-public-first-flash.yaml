  - id: select_settings_section
    mode: restart
    parameters:
      section: int
    then:
      - lambda: |-
          id(settings_section_value) = usp_settings_sections::sanitize(section);
          lv_obj_t *panels[] = {
              id(settings_display_panel), id(settings_language_panel),
              id(settings_region_panel), id(settings_sound_panel),
              id(settings_network_panel), id(settings_system_panel)};
          lv_obj_t *buttons[] = {
              id(settings_section_display), id(settings_section_language),
              id(settings_section_region), id(settings_section_sound),
              id(settings_section_network), id(settings_section_system)};
          usp_settings_sections::apply(
              panels, buttons, id(settings_section_value));
      - script.execute: refresh_settings_network

  - id: refresh_settings_sections
    mode: restart
    then:
      - lambda: |-
          const unsigned lang = id(ui_language);
          lv_obj_t *buttons[] = {
              id(settings_section_display), id(settings_section_language),
              id(settings_section_region), id(settings_section_sound),
              id(settings_section_network), id(settings_section_system)};
          for (unsigned index = 0; index < usp_settings_sections::COUNT; ++index)
            usp_lcd_navigation::button_text(
                buttons[index], usp_settings_sections::name(lang, index));
          usp_lcd_navigation::label_text(
              id(settings_sound_title), usp_settings_sections::name(lang, 3));
          usp_lcd_navigation::label_text(
              id(settings_network_title), usp_settings_sections::name(lang, 4));
          usp_lcd_navigation::label_text(
              id(settings_language_note), usp_settings_sections::note(lang, 0));
          usp_lcd_navigation::label_text(
              id(settings_region_note), usp_settings_sections::note(lang, 1));
          usp_lcd_navigation::label_text(
              id(settings_sound_note), usp_settings_sections::note(lang, 2));
          usp_lcd_navigation::label_text(
              id(settings_network_note), usp_settings_sections::note(lang, 3));
          usp_lcd_navigation::button_text(
              id(settings_region_choose), usp_settings_sections::choose_region(lang));
