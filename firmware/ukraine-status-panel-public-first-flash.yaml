script:
  - id: refresh_panel_restart_button
    mode: restart
    then:
      - lambda: |-
          const bool pending = usp_confirmation::restart_request().pending(millis());
          const unsigned language = id(ui_language) < 3 ? id(ui_language) : 0;
          usp_lcd_navigation::button_text(
              id(panel_restart_ui_button), usp_restart_confirm_text::label(
                  language, pending ? usp_restart_confirm_text::Label::CONFIRM
                                    : usp_restart_confirm_text::Label::RESTART));
          lv_obj_set_style_bg_color(id(panel_restart_ui_button),
              lv_color_hex(pending ? 0xB91C1C : 0x7F1D1D), LV_PART_MAIN);

  - id: confirm_panel_restart
    mode: restart
    then:
      - if:
          condition:
            lambda: return usp_confirmation::restart_request().activate(millis());
          then:
            - button.press: panel_restart_button
          else:
            - script.execute: refresh_panel_restart_button
            - delay: 10s
            - lambda: usp_confirmation::restart_request().clear();
            - script.execute: refresh_panel_restart_button


  - id: load_alarm_forms
    mode: restart
    then:
      - lambda: |-
          esphome::lvgl::LvDropdownType *hours[] = {id(alarm_hour_0), id(alarm_hour_1), id(alarm_hour_2)};
          esphome::lvgl::LvDropdownType *minutes[] = {id(alarm_minute_0), id(alarm_minute_1), id(alarm_minute_2)};
          lv_obj_t *enabled[] = {id(alarm_enabled_0), id(alarm_enabled_1), id(alarm_enabled_2)};
          for (size_t index = 0; index < 3; ++index) {
            const auto &record = id(personal_alarms).slot(index);
            lv_dropdown_set_selected(hours[index]->obj, record.minute / 60);
            lv_dropdown_set_selected(minutes[index]->obj, record.minute % 60);
            id(alarm_form_repeat)[index] = usp_alarm_ui::selected(record.weekdays);
            if (record.enabled) lv_obj_add_state(enabled[index], LV_STATE_CHECKED);
            else lv_obj_remove_state(enabled[index], LV_STATE_CHECKED);
            id(alarm_form_revisions)[index] = id(personal_alarms).revision(index);
          }

  - id: save_alarm_form
    mode: restart
    parameters:
      slot: int
    then:
      - lambda: |-
          if (slot < 0 || slot >= 3) return;
          esphome::lvgl::LvDropdownType *hours[] = {id(alarm_hour_0), id(alarm_hour_1), id(alarm_hour_2)};
          esphome::lvgl::LvDropdownType *minutes[] = {id(alarm_minute_0), id(alarm_minute_1), id(alarm_minute_2)};
          lv_obj_t *enabled[] = {id(alarm_enabled_0), id(alarm_enabled_1), id(alarm_enabled_2)};
          const unsigned hour = lv_dropdown_get_selected(hours[slot]->obj);
          const unsigned minute = lv_dropdown_get_selected(minutes[slot]->obj);
          if (hour > 23 || minute > 59) return;
          char value[6];
          std::snprintf(value, sizeof(value), "%02u:%02u", hour, minute);
          const uint8_t days = usp_alarm_ui::mask(id(alarm_form_repeat)[slot]);
          if (id(personal_alarms).configure(slot, value, days,
                  lv_obj_has_state(enabled[slot], LV_STATE_CHECKED),
                  id(alarm_form_revisions)[slot])) {
            id(alarm_form_revisions)[slot] = id(personal_alarms).revision(slot);
          }

  - id: select_alarm_repeat
    mode: restart
    parameters:
      slot: int
      preset: int
    then:
      - lambda: |-
          if (slot < 0 || slot >= 3 || preset < 0 || preset >= 3) return;
          id(alarm_form_repeat)[slot] = static_cast<uint8_t>(preset);
      - script.execute: refresh_alarm_days

  - id: refresh_alarm_days
    mode: restart
    then:
      - lambda: |-
          if (!id(lcd_navigation_ready) || id(lcd_navigation_page) != 11) return;
          lv_obj_t *buttons[3][3] = {
              {id(alarm_repeat_0_0), id(alarm_repeat_0_1), id(alarm_repeat_0_2)},
              {id(alarm_repeat_1_0), id(alarm_repeat_1_1), id(alarm_repeat_1_2)},
              {id(alarm_repeat_2_0), id(alarm_repeat_2_1), id(alarm_repeat_2_2)}};
          lv_obj_t *summary[] = {id(alarm_days_0), id(alarm_days_1), id(alarm_days_2)};
          for (size_t index = 0; index < 3; ++index)
            usp_alarm_days_ui::render(buttons[index], summary[index],
                id(ui_language), id(alarm_form_repeat)[index]);

  - id: refresh_alarm_labels
    mode: restart
    then:
      - lambda: |-
          if (!id(lcd_navigation_ready)) return;
          const uint8_t language = id(ui_language);
          lv_label_set_text(lv_obj_get_child(id(clock_alarms), 0), usp_alarm_ui::title(language));
          if (id(lcd_navigation_page) != 11) return;
          lv_label_set_text(id(alarms_title), usp_alarm_ui::title(language));
          lv_label_set_text(lv_obj_get_child(id(alarms_back), 0), usp_alarm_controls_text::label(language, usp_alarm_controls_text::Label::CLOCK));
          lv_label_set_text(id(alarms_time_caption), usp_alarm_controls_text::label(language, usp_alarm_controls_text::Label::TIME));
          lv_label_set_text(id(alarms_repeat_caption), usp_alarm_controls_text::label(language, usp_alarm_controls_text::Label::REPEAT));
          lv_label_set_text(id(alarms_note), usp_alarm_controls_text::label(language, usp_alarm_controls_text::Label::NOTE));
          const bool alarm_sound = id(alarm_sound_enabled);
          lv_label_set_text(lv_obj_get_child(id(alarms_sound_toggle), 0), alarm_sound ?
              usp_alarm_controls_text::label(language, usp_alarm_controls_text::Label::SOUND_ON) :
              usp_alarm_controls_text::label(language, usp_alarm_controls_text::Label::SOUND_OFF));
          lv_obj_set_style_bg_color(id(alarms_sound_toggle),
              lv_color_hex(alarm_sound ? 0x166534 : 0x263D57), LV_PART_MAIN);
          lv_obj_t *enabled[] = {id(alarm_enabled_0), id(alarm_enabled_1), id(alarm_enabled_2)};
          lv_obj_t *save[] = {id(alarm_save_0), id(alarm_save_1), id(alarm_save_2)};
          for (size_t index = 0; index < 3; ++index) {
            const bool on = lv_obj_has_state(enabled[index], LV_STATE_CHECKED);
            lv_label_set_text(lv_obj_get_child(enabled[index], 0), on ?
                usp_alarm_controls_text::label(language, usp_alarm_controls_text::Label::ON) :
                usp_alarm_controls_text::label(language, usp_alarm_controls_text::Label::OFF));
            lv_obj_set_style_bg_color(enabled[index], lv_color_hex(on ? 0x166534 : 0x263D57), LV_PART_MAIN);
            lv_label_set_text(lv_obj_get_child(save[index], 0), usp_alarm_controls_text::label(language, usp_alarm_controls_text::Label::SAVE));
          }
      - script.execute: refresh_alarm_days

  - id: refresh_alarm_state
    mode: restart
    then:
      - delay: 10ms
      - if:
          condition:
            lambda: return id(alarm_popup_was_open) && !id(personal_alarms).active();
          then:
            - script.stop: alarm_audio_loop
            - rtttl.stop:
                id: panel_buzzer
      - lambda: |-
          if (!id(lcd_navigation_ready)) return;
          const auto &manager = *id(personal_alarms);
          const uint8_t language = id(ui_language);
          id(alarm_popup_was_open) = manager.active() != 0;
          if (manager.active()) lv_obj_remove_flag(id(alarm_notification), LV_OBJ_FLAG_HIDDEN);
          else lv_obj_add_flag(id(alarm_notification), LV_OBJ_FLAG_HIDDEN);
          const bool enabled = manager.slot(0).enabled || manager.slot(1).enabled || manager.slot(2).enabled;
          if (id(lcd_navigation_page) == 11) lv_label_set_text(id(alarms_status),
              usp_alarm_ui::status(language, manager.storage_ok(), manager.error_code(), manager.clock_valid(), manager.active(), enabled));
          if (!manager.active()) return;
          std::string body;
          for (size_t index = 0; index < 3; ++index) {
            if (!(manager.active() & (1U << index))) continue;
            if (!body.empty()) body += "\n";
            body += std::to_string(index + 1) + " · " + manager.notification_time(index);
          }
          lv_label_set_text(id(alarm_notification_title), usp_alarm_ui::title(language));
          lv_label_set_text(id(alarm_notification_body), body.c_str());
          lv_label_set_text(id(alarm_notification_sound), id(alarm_sound_enabled) ?
              usp_alarm_controls_text::label(language, usp_alarm_controls_text::Label::NOTIFY_SOUND_ON) :
              usp_alarm_controls_text::label(language, usp_alarm_controls_text::Label::NOTIFY_SOUND_OFF));
          lv_label_set_text(lv_obj_get_child(id(alarm_dismiss), 0), usp_alarm_controls_text::label(language, usp_alarm_controls_text::Label::DISMISS));

  - id: schedule_room_current_refresh
    mode: restart
    then:
      - delay: 10ms
      - if:
          condition:
            lambda: return id(lcd_navigation_ready) && id(lcd_navigation_page) == 10;
          then:
            - script.execute: refresh_room_current_ui

  - id: schedule_room_graph_refresh
    mode: restart
    then:
      - delay: 10ms
      - if:
          condition:
            lambda: return id(lcd_navigation_ready) && id(lcd_navigation_page) == 10;
          then:
            - script.execute: refresh_room_graph_ui

  - id: refresh_room_current_ui
    mode: restart
    then:
      - lambda: |-
          if (!id(lcd_navigation_ready) || id(lcd_navigation_page) != 10) return;
          const uint8_t lang = id(ui_language) < 3 ? id(ui_language) : 0;
          usp_lcd_navigation::label_text(id(room_title),
              usp_room_ui_text::label(lang, usp_room_ui_text::Label::ROOM));
          usp_lcd_navigation::label_text(id(room_indoor_caption),
              usp_room_ui_text::label(lang, usp_room_ui_text::Label::INDOOR));
          usp_lcd_navigation::label_text(id(room_outdoor_caption),
              usp_room_ui_text::label(lang, usp_room_ui_text::Label::OUTDOOR));
          usp_lcd_navigation::button_text(id(room_weather_button),
              usp_room_ui_text::label(lang, usp_room_ui_text::Label::WEATHER));
          usp_lcd_navigation::button_text(id(room_home_button),
              usp_room_ui_text::label(lang, usp_room_ui_text::Label::HOME));
      - lambda: |-
          if (!id(lcd_navigation_ready) || id(lcd_navigation_page) != 10) return;
          const uint8_t lang = id(ui_language) < 3 ? id(ui_language) : 0;
          const bool detected = id(environment_sht4x).detected();
          const bool valid = detected && id(environment_sht4x).last_read_ok()
              && std::isfinite(id(environment_temperature).state)
              && std::isfinite(id(environment_humidity).state);
          char temp[24] = "--.-\u00b0C";
          char humidity[16] = "--%";
          if (valid) {
            std::snprintf(temp, sizeof(temp), "%.1f\u00b0C", id(environment_temperature).state);
            std::snprintf(humidity, sizeof(humidity), "%d%%",
                static_cast<int>(std::lround(id(environment_humidity).state)));
          }
          usp_lcd_navigation::label_text(id(room_temperature_value), temp);
          usp_lcd_navigation::label_text(id(room_humidity_value), humidity);
          const char *status = !detected
              ? usp_room_ui_text::label(lang, usp_room_ui_text::Label::SENSOR_ABSENT)
              : (valid ? "SHT41/SHT45 \u00b7 OK"
                       : usp_room_ui_text::label(lang, usp_room_ui_text::Label::SENSOR_WAITING));
          usp_lcd_navigation::label_text(id(room_sensor_status), status);
          usp_lcd_navigation::label_color(id(room_sensor_status), valid ? 0x4ADE80 : (detected ? 0xFACC15 : 0x91A8B2));
      - lambda: |-
          if (!id(lcd_navigation_ready) || id(lcd_navigation_page) != 10) return;
          const auto weather_view = id(weather_client).current_snapshot();
          const uint8_t lang = id(ui_language) < 3 ? id(ui_language) : 0;
          const bool valid = weather_view.valid
              && std::isfinite(weather_view.temperature_c);
          const int value = valid ? static_cast<int>(std::lround(
              weather_view.temperature_c)) : 0;
          const std::string temperature = valid
              ? usp_ui_i18n::temperature_c(value)
              : usp_ui_i18n::temperature_c_placeholder();
          const std::string status = usp_ui_i18n::compact_weather_status(
              valid, weather_view.stale_latched,
              weather_view.fetch_ok, lang);
          usp_lcd_navigation::label_text(
              id(room_outdoor_temperature), temperature.c_str());
          usp_lcd_navigation::label_text(
              id(room_outdoor_city), weather_view.city.c_str());
          usp_lcd_navigation::label_text(
              id(room_outdoor_status), ("Open-Meteo \u00b7 " + status).c_str());
          usp_lcd_navigation::label_color(id(room_outdoor_status),
              valid && !weather_view.stale_latched ? 0x4ADE80 : 0xFACC15);
  - id: refresh_room_graph_ui
    mode: restart
    then:
      - lambda: |-
          if (!id(lcd_navigation_ready) || id(lcd_navigation_page) != 10) return;
          static bool using_psram = false;
          static bool logged = false;
          static usp_room_chart::Workspace *work = nullptr;
          if (work == nullptr) work = usp_room_chart::allocate_workspace(&using_psram);
          if (work == nullptr) {
            ESP_LOGE("usp.room", "ROOM_GRAPH workspace allocation failed");
            return;
          }
          const auto now = id(panel_time).now();
          const auto period = usp_room_period::sanitize(id(room_history_period));
          if (period == usp_room_period::Period::HOURS_24) {
            usp_room_chart::build(*id(room_history),
                now.is_valid() ? static_cast<uint32_t>(now.timestamp) : 0U,
                420, 120, 120, &work->model);
          } else {
            uint32_t day_key = 0;
            if (now.is_valid()) {
              day_key = esphome::usp_room_aggregate_history::RoomAggregateHistory::local_day_key(
                  now.year, now.day_of_year);
            }
            const uint32_t end = period == usp_room_period::Period::DAYS_7 && day_key != 0
                ? day_key * 24U + now.hour : day_key;
            usp_room_period_chart::build(*id(room_aggregate_history), period, end,
                420, 120, 120, &work->model);
          }
