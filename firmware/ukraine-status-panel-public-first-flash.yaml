          const bool changed = id(lcd_navigation_mode_value) != static_cast<uint8_t>(fullscreen);
          id(lcd_navigation_mode_value) = fullscreen ? 1 : 0;
          if (!fullscreen) usp_lcd_navigation::hidden(id(lcd_navigation_menu), true);
          id(lcd_navigation_mode_select).publish_state(fullscreen ? "Fullscreen" : "Buttons");
          if (changed) {
            id(panel_lvgl).invalidate_home_native_frame_cache();
            if (id(lcd_navigation_page) == 0) id(schedule_home_native_frame_cache).execute();
          }
          ESP_LOGI("usp.navigation", "LCD_MODE value=%s", fullscreen ? "Fullscreen" : "Buttons");
      - script.execute: refresh_lcd_navigation
      - if:
          condition:
            lambda: return fullscreen && !id(lcd_navigation_help_seen);
          then:
            - lambda: |-
