      # Only the currently visible map surface is mutated; hidden surfaces are
      # synchronized lazily from alert_render_states when their page is opened.
      - if:
          condition:
            lvgl.page.is_showing:
              id: page_home
          then:
            - if:
                condition:
                  lambda: |-
                    lv_obj_t *originals[26] = {
                        id(dash_region_ua_05), id(dash_region_ua_07),
                        id(dash_region_ua_09), id(dash_region_ua_12),
                        id(dash_region_ua_14), id(dash_region_ua_18),
                        id(dash_region_ua_21), id(dash_region_ua_23),
                        id(dash_region_ua_26), id(dash_region_ua_32),
                        id(dash_region_ua_35), id(dash_region_ua_43),
                        id(dash_region_ua_46), id(dash_region_ua_48),
                        id(dash_region_ua_51), id(dash_region_ua_53),
                        id(dash_region_ua_56), id(dash_region_ua_59),
                        id(dash_region_ua_61), id(dash_region_ua_63),
                        id(dash_region_ua_65), id(dash_region_ua_68),
                        id(dash_region_ua_71), id(dash_region_ua_74),
                        id(dash_region_ua_77), id(dashboard_map_outline)};
