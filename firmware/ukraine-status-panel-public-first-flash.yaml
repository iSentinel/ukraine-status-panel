              lv_color_hex(mode == 1 ? active : idle), LV_PART_MAIN);
          lv_obj_set_style_bg_color(
              id(palette_mono_button),
              lv_color_hex(mode == 2 ? active : idle), LV_PART_MAIN);
      - script.execute: refresh_selected_neptun_ui

  - id: refresh_alert_map_palette_ui
    mode: restart
    then:
      - if:
          condition:
            lvgl.page.is_showing:
              id: page_map
          then:
            - if:
                condition:
                  lambda: |-
                    return id(alert_map_applied_palette) !=
                        usp_alert_palette::sanitize_mode(
                            id(ui_alert_palette));
                then:
                  - repeat:
                      count: 13
                      then:
                        - lambda: |-
                            const size_t begin =
                                static_cast<size_t>(iteration) * 2U;
                            const size_t end = std::min(
                                begin + 2U, static_cast<size_t>(25));
                            lv_obj_t *regions[25] = {
                                id(alert_region_ua_05), id(alert_region_ua_07), id(alert_region_ua_09), id(alert_region_ua_12), id(alert_region_ua_14),
                                id(alert_region_ua_18), id(alert_region_ua_21), id(alert_region_ua_23), id(alert_region_ua_26), id(alert_region_ua_32),
                                id(alert_region_ua_35), id(alert_region_ua_43), id(alert_region_ua_46), id(alert_region_ua_48), id(alert_region_ua_51),
                                id(alert_region_ua_53), id(alert_region_ua_56), id(alert_region_ua_59), id(alert_region_ua_61), id(alert_region_ua_63),
                                id(alert_region_ua_65), id(alert_region_ua_68), id(alert_region_ua_71), id(alert_region_ua_74), id(alert_region_ua_77)};
                            const uint8_t palette =
                                usp_alert_palette::sanitize_mode(
                                    id(ui_alert_palette));
                            for (size_t index = begin; index < end; ++index) {
                              const uint8_t state =
                                  id(alert_render_states)[index];
                              uint32_t color = usp_alert_region_colors::color_hex(
                                  state, palette);
                              lv_obj_set_style_image_recolor(
                                  regions[index], lv_color_hex(color),
                                  LV_PART_MAIN);
                            }
                            ESP_LOGD(
                                "usp.map",
                                "Alert map palette batch=%u palette=%u",
                                static_cast<unsigned>(iteration),
                                static_cast<unsigned>(palette));
                        - delay: 20ms
                  - lambda: |-
                      id(alert_map_applied_palette) =
                          usp_alert_palette::sanitize_mode(
                              id(ui_alert_palette));

  - id: alert_render_worker
    # Single-flight renderer: never interrupt an inflight region transaction.
    # Keep at most one queued execution; because producers update the shared
    # pending snapshot before execute(), that queued run naturally consumes
    # the newest state and coalesces intermediate bursts.
    mode: queued
    max_runs: 2
    then:
      - delay: 20ms
      - lambda: |-
          id(alert_render_mode) = id(alert_pending_mode);
          id(alert_render_revision) =
              id(alert_pending_revision);
          id(alert_render_reason) =
              id(alert_pending_reason);

          id(alert_render_started_ms) = millis();
          id(alert_render_changed_count) = 0;
          id(alert_render_dirty_mask) = 0;

          for (size_t i = 0; i < 25; ++i) {
            const int raw =
                id(alert_pending_states)[i];
            const uint8_t desired =
                usp_alert_state::normalize(raw);

            // All downstream UI surfaces consume the same normalized state.
            // This prevents map colors and alert text from disagreeing when
            // the upstream legacy state contains multiple threat bits.
            id(alert_render_states)[i] = desired;
            id(alert_render_desired_states)[i] = desired;

            const uint32_t bit =
                1UL << i;

            if (
                (id(alert_render_inflight_mask) & bit)
                    != 0
                || (id(alert_render_cache_valid_mask) & bit)
                    == 0
                || id(alert_render_cache_states)[i]
                    != desired) {
              id(alert_render_dirty_mask) |= bit;
            }
          }

          ESP_LOGD(
              "usp.render",
              "Worker start mode=%u revision=%s dirty=0x%08lX cache=0x%08lX inflight=0x%08lX",
              id(alert_render_mode),
              id(alert_render_revision).c_str(),
              static_cast<unsigned long>(
                  id(alert_render_dirty_mask)),
              static_cast<unsigned long>(
                  id(alert_render_cache_valid_mask)),
              static_cast<unsigned long>(
                  id(alert_render_inflight_mask)));
      - lambda: |-
          // Only the ordinary map owns the region widgets mutated below.
          // Never stall unrelated visible pages while this transaction runs.
          // Keep the hold bounded so an unexpected script exit self-recovers.
          id(alert_render_refresh_gate_active) = false;
          if (id(lcd_navigation_page) != 1U
              || !lv_obj_is_valid(id(page_map).obj)
              || lv_scr_act() != id(page_map).obj) {
            return;
          }

          lv_timer_t *refresh_timer =
              lv_display_get_refr_timer(
                  lv_display_get_default());
          if (refresh_timer != nullptr) {
            lv_timer_set_period(refresh_timer, 2000UL);
            id(alert_render_refresh_gate_active) = true;
          }
      - if:
          condition:
            lambda: 'return id(alert_render_mode) == 1;'
          then:
            - lvgl.label.update:
                id: alert_mock_state_label
                text: "STALE"
            - lambda: |-
                ESP_LOGW(
                    "usp.render",
                    "STALE rendered reason=%s",
                    id(alert_render_reason).c_str());
          else:
            - lambda: |-
                lv_obj_t *regions[] = {
                    id(alert_region_ua_05),
                    id(alert_region_ua_07),
                    id(alert_region_ua_09),
                    id(alert_region_ua_12),
                    id(alert_region_ua_14),
                };
                usp_alert_region_batch::render(
                    0U, 5U, id(alert_render_desired_states),
                    id(alert_render_dirty_mask),
                    id(alert_render_cache_states),
                    id(alert_render_cache_valid_mask),
                    id(alert_render_inflight_mask),
                    id(alert_render_changed_count),
                    id(ui_alert_palette),
                    [&](size_t offset, uint32_t color) {
                      lv_obj_set_style_image_recolor(
                          regions[offset], lv_color_hex(color), LV_PART_MAIN);
                    });
            - delay: 1ms
            - lambda: |-
                lv_obj_t *regions[] = {
                    id(alert_region_ua_18),
                    id(alert_region_ua_21),
                    id(alert_region_ua_23),
                    id(alert_region_ua_26),
                    id(alert_region_ua_32),
                };
                usp_alert_region_batch::render(
                    5U, 5U, id(alert_render_desired_states),
                    id(alert_render_dirty_mask),
                    id(alert_render_cache_states),
                    id(alert_render_cache_valid_mask),
                    id(alert_render_inflight_mask),
                    id(alert_render_changed_count),
                    id(ui_alert_palette),
                    [&](size_t offset, uint32_t color) {
                      lv_obj_set_style_image_recolor(
                          regions[offset], lv_color_hex(color), LV_PART_MAIN);
                    });
            - delay: 1ms
            - lambda: |-
                lv_obj_t *regions[] = {
                    id(alert_region_ua_35),
                    id(alert_region_ua_43),
                    id(alert_region_ua_46),
                    id(alert_region_ua_48),
                    id(alert_region_ua_51),
                };
                usp_alert_region_batch::render(
                    10U, 5U, id(alert_render_desired_states),
                    id(alert_render_dirty_mask),
                    id(alert_render_cache_states),
                    id(alert_render_cache_valid_mask),
                    id(alert_render_inflight_mask),
                    id(alert_render_changed_count),
                    id(ui_alert_palette),
                    [&](size_t offset, uint32_t color) {
                      lv_obj_set_style_image_recolor(
                          regions[offset], lv_color_hex(color), LV_PART_MAIN);
                    });
            - delay: 1ms
            - lambda: |-
                lv_obj_t *regions[] = {
                    id(alert_region_ua_53),
                    id(alert_region_ua_56),
                    id(alert_region_ua_59),
                    id(alert_region_ua_61),
                    id(alert_region_ua_63),
                };
                usp_alert_region_batch::render(
                    15U, 5U, id(alert_render_desired_states),
                    id(alert_render_dirty_mask),
                    id(alert_render_cache_states),
                    id(alert_render_cache_valid_mask),
                    id(alert_render_inflight_mask),
                    id(alert_render_changed_count),
                    id(ui_alert_palette),
                    [&](size_t offset, uint32_t color) {
                      lv_obj_set_style_image_recolor(
                          regions[offset], lv_color_hex(color), LV_PART_MAIN);
                    });
            - delay: 1ms
            - lambda: |-
                lv_obj_t *regions[] = {
                    id(alert_region_ua_65),
                    id(alert_region_ua_68),
                    id(alert_region_ua_71),
                    id(alert_region_ua_74),
                    id(alert_region_ua_77),
                };
                usp_alert_region_batch::render(
                    20U, 5U, id(alert_render_desired_states),
                    id(alert_render_dirty_mask),
                    id(alert_render_cache_states),
                    id(alert_render_cache_valid_mask),
                    id(alert_render_inflight_mask),
                    id(alert_render_changed_count),
                    id(ui_alert_palette),
                    [&](size_t offset, uint32_t color) {
                      lv_obj_set_style_image_recolor(
                          regions[offset], lv_color_hex(color), LV_PART_MAIN);
                    });
            - delay: 1ms
            - if:
                condition:
                  lambda: 'return id(alert_render_mode) == 0;'
                then:
                  - lvgl.label.update:
                      id: alert_mock_state_label
                      text: "LIVE"
                  - lambda: |-
                      id(alert_live_revision) =
                          id(alert_render_revision);

                      const uint32_t elapsed =
                          static_cast<uint32_t>(
                              millis() -
                              id(alert_render_started_ms));

                      ESP_LOGI(
                          "usp.render",
                          "Rendered frame revision=%s changes=%u duration=%lu ms inflight=0x%08lX",
                          id(alert_render_revision).c_str(),
                          id(alert_render_changed_count),
                          static_cast<unsigned long>(elapsed),
                          static_cast<unsigned long>(
                              id(alert_render_inflight_mask)));
                else:
                  - lvgl.label.update:
                      id: alert_mock_state_label
                      text: "NO DATA"
                  - lambda: |-
                      const uint32_t elapsed =
                          static_cast<uint32_t>(
                              millis() -
                              id(alert_render_started_ms));

                      ESP_LOGI(
                          "usp.render",
                          "NO DATA rendered reason=%s changes=%u duration=%lu ms inflight=0x%08lX",
                          id(alert_render_reason).c_str(),
                          id(alert_render_changed_count),
                          static_cast<unsigned long>(elapsed),
                          static_cast<unsigned long>(
                              id(alert_render_inflight_mask)));
      - lambda: |-
          if (id(alert_render_changed_count) == 25U) {
            id(alert_map_applied_palette) =
                usp_alert_palette::sanitize_mode(
                    id(ui_alert_palette));
          }
      - lambda: |-
          // Restore the timer if this transaction armed the ordinary-map
          // refresh hold. Ownership is remembered even if the page changes
          // while the queued worker is running.
          if (!id(alert_render_refresh_gate_active)) return;

          lv_timer_t *refresh_timer =
              lv_display_get_refr_timer(
                  lv_display_get_default());
          if (refresh_timer != nullptr) {
            lv_timer_set_period(refresh_timer, 16UL);
