  - id: refresh_settings_network
    mode: restart
    then:
      - if:
          condition:
            and:
              - lvgl.page.is_showing:
                  id: page_settings
              - lambda: return id(settings_section_value) == 4;
          then:
            - lambda: |-
                const bool connected = wifi::global_wifi_component->is_connected();
                usp_lcd_navigation::label_text(id(settings_network_state),
                    usp_settings_sections::network(id(ui_language), connected));
                char text[network::IP_ADDRESS_BUFFER_SIZE + 4] = "IP: --";
                if (connected) {
                  const auto addresses = network::get_ip_addresses();
                  if (addresses[0].is_set()) {
                    char ip[network::IP_ADDRESS_BUFFER_SIZE];
                    addresses[0].str_to(ip);
                    snprintf(text, sizeof(text), "IP: %s", ip);
                  }
                }
                usp_lcd_navigation::label_text(id(settings_network_ip), text);

