  - id: alert_freshness_check
    mode: restart
    then:
      - lambda: |-
          const auto snapshot = id(neptun_client).snapshot();
          const auto frame = usp_alert_source::neptun_frame(
              snapshot, millis(), id(neptun_client).stale_after_ms(),
              esphome::usp_neptun::region_alert_index);
          usp_alert_source::policy().choose(
              frame, millis(),
              ${alert_stale_timeout_s}UL * 1000UL);
      - if:
          condition:
            lambda: return usp_alert_source::policy().source() != usp_alert_source::Source::NONE;
          then:
            - script.execute: apply_selected_alert_source
          else:
            - script.execute: mark_alert_sources_unavailable
      - script.execute: refresh_selected_threat_source

  - id: apply_selected_alert_source
    mode: restart
    then:
      - lambda: |-
          const auto &policy = usp_alert_source::policy();
          const auto &frame = policy.chosen();
          const uint8_t source = static_cast<uint8_t>(policy.source());
          const uint8_t previous = id(alert_map_source);
          bool changed = previous != source || id(alert_pending_mode) != 0;
          for (size_t i = 0; i < 25; ++i) {
            changed |= id(alert_pending_states)[i] != frame.states[i];
            id(alert_pending_states)[i] = frame.states[i];
          }
          char revision[64];
          std::snprintf(revision, sizeof(revision), "%s-%08lX-%lu",
              source == 2 ? "neptun" : "api",
              static_cast<unsigned long>(frame.signature),
              static_cast<unsigned long>(frame.sequence));
          const std::string next = source == 3 ? policy.api_revision() : std::string(revision);
          if (source != 3 && next != id(alert_pending_revision)) id(alert_live_accepted_frames)++;
          id(alert_pending_revision) = next;
          id(alert_pending_reason) = source == 2 ? "neptun-primary-live" :
              "api-live";
          id(alert_pending_mode) = 0;
          id(alert_map_source) = source;
          id(alert_live_state) = 1;
          id(alert_live_last_update_ms) = frame.received_ms;
          if (previous != source)
            ESP_LOGI("usp.alert.source", "SOURCE_SELECT source=%u provider=NEPTUN previous=%u",
                static_cast<unsigned>(source), static_cast<unsigned>(previous));
          if (changed) {
            if (source == 2) id(alert_neptun_fallback_updates)++;
            id(alert_render_worker).execute();
          } else id(alert_live_revision) = next;

  - id: mark_alert_sources_unavailable
    mode: restart
    then:
      - lambda: |-
          const bool missing = id(alert_live_last_update_ms) == 0 ||
              static_cast<uint32_t>(millis() - id(alert_live_last_update_ms)) >=
                  ${alert_nodata_timeout_s}UL * 1000UL;
          const uint8_t mode = missing ? 2 : 1;
          const bool changed = id(alert_map_source) != 0 || id(alert_pending_mode) != mode;
          id(alert_map_source) = 0;
          id(alert_pending_mode) = mode;
          id(alert_live_state) = missing ? 0 : 2;
          id(alert_pending_reason) = "all-alert-sources-unavailable";
          if (missing) for (size_t i = 0; i < 25; ++i) id(alert_pending_states)[i] = 0;
          if (changed) {
            ESP_LOGW("usp.alert.source", "SOURCE_SELECT source=0 state=%s", missing ? "NO_DATA" : "STALE");
            id(alert_render_worker).execute();
          }

