                usp_lcd_navigation::hidden(id(lcd_navigation_menu), false);
      - if:
          condition:
            lambda: return id(lcd_navigation_page) == 1 || id(lcd_navigation_page) == 6;
          then:
            - script.execute:
                id: navigate_lcd_page
                page: 1
      - if:
          condition:
            lambda: return id(lcd_navigation_page) == 2 || id(lcd_navigation_page) == 7;
          then:
            - script.execute:
                id: navigate_lcd_page
                page: 2

  - id: navigate_lcd_page
    mode: restart
    parameters:
      page: int
    then:
      - if:
          condition:
            lambda: return page == 0;
          then:
            - script.execute: show_home_fast
      - if:
          condition:
            lambda: return page == 1;
          then:
            - if:
                condition:
                  lambda: return usp_lcd_gesture::fullscreen_mode(id(lcd_navigation_mode_value));
