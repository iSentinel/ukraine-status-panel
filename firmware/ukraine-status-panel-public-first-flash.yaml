substitutions:
  device_name: "ukraine-status-panel"
  friendly_name: "Ukraine Status Panel"
  firmware_version: "0.115.407-dev"
  ota_trust_key_id: "ed25519:10ac93051fa3c7d5"
  ota_update_policy: "ENCRYPTED OTA / MANIFEST CHECK ONLY / WEB OTA OFF"
  # Development/CI-only LVGL geometry overlay. Production default stays off.
  lvgl_debug_outline: "false"

  # Bound the age of diagnostic API frames (180 s).
  alert_stale_timeout_s: "180"
  alert_nodata_timeout_s: "300"

esphome:
  name: "${device_name}"
  friendly_name: "${friendly_name}"
  name_add_mac_suffix: true
  build_path: build/ukraine-status-panel-public-first-flash
  comment: "Ukraine Status Panel public first-flash image"
  project:
    name: "ukraine-status-panel.panel"
    version: "${firmware_version}"
  includes:
    - include/usp_button_label_layout.h
    - include/usp_confirmation.h
    - include/usp_swipe_navigation.h
    - include/usp_lcd_navigation_trace.h
    - include/usp_touch_event_time.h
    - include/usp_lcd_navigation_controller.h
    - include/usp_navigation_text.h
    - include/usp_footer_text.h
    - include/usp_fullscreen_context_text.h
    - include/usp_settings_text.h
    - include/usp_settings_sections.h
    - include/usp_history_text.h
    - include/usp_diagnostics_text.h
    - include/usp_diagnostics_runtime_text.h
    - include/usp_optional_hardware_text.h
    - include/usp_indoor_text.h
    - include/usp_indoor_lcd_delivery.h
    - include/usp_weather_page_text.h
    - include/usp_map_page_text.h
    - include/usp_power_page_text.h
    - include/usp_home_page_text.h
    - include/usp_live_badge_text.h
    - include/usp_sound_controls_text.h
    - include/usp_restart_confirm_text.h
    - include/usp_alarm_controls_text.h
    - include/usp_room_ui_text.h
    - include/usp_clock_ui_text.h
    - include/usp_wifi_status_text.h
    - include/usp_neptun_status_text.h
    - include/usp_room_summary_text.h
    - include/usp_weather_fullscreen_text.h
    - include/usp_clock_presentation.h
    - include/usp_alarm_ui.h
    - include/usp_alarm_days_ui.h
    - include/usp_room_chart.h
    - include/usp_room_chart_model.h
    - include/usp_room_period.h
    - include/usp_room_period_chart.h
    - include/usp_room_period_text.h
    - include/usp_transition_probe.h
    - include/usp_stripe_composer.h
    - include/usp_stripe_bandwidth_probe.h
    - include/usp_wifi_icon.h
    - include/usp_battery_model.h
    - include/usp_ui_format.h
    - include/usp_weather_codes.h
    - include/usp_weather_icon_model.h
    - include/usp_weather_time.h
    - include/usp_weather_timezone.h
    - include/usp_weather_view_types.h
    - include/usp_weather_lcd_delivery.h
    - include/usp_weather_view.h
    - include/usp_provider_time.h
    - include/usp_forecast_view_types.h
    - include/usp_forecast_view.h
    - include/usp_forecast_details_view.h
    - include/usp_weather_refresh_gate.h
    - include/usp_http_retry_after.h
    - include/usp_spotify_pkce.h
    - include/usp_spotify_auth_return.h
    - include/usp_forecast_chart.h
    - include/usp_ui_i18n_0_115_107.h
    - include/usp_ui_i18n.h
    - include/usp_map_touch_0_115_49.h
    - include/usp_alert_rows_0_115_103.h
    - include/usp_alert_state_0_115_103.h
    - include/usp_alert_region_ids.h
    - include/usp_alert_source_policy.h
    - include/usp_alert_freshness_0_115_103.h
    - include/usp_alert_palette_0_115_114.h
    - include/usp_alert_region_batch.h
    - include/usp_alert_region_colors.h
    - include/usp_threat_icons_ui.h
    - include/usp_map_render_primitives.h
    - include/usp_map_present_gate.h
    - include/usp_fullscreen_map_runs.h
    - include/usp_map_cache_renderer.h
    - include/usp_fullscreen_map_cache.h
    - include/usp_dashboard_map_runs.h
    - include/usp_dashboard_map_renderer.h
    - include/usp_dashboard_map_cache.h



  on_boot:
    - priority: -101
      then:
        - lambda: |-
            usp_lcd_navigation::controller().attach(
                id(lcd_navigation_escape_zone), id(lcd_navigation_menu));
            usp_lcd_navigation::controller().trace().set_sink(
                [](const char *stage, const usp_lcd_navigation::TouchTraceRecord &t) {
                  ESP_LOGI("usp.touch",
                      "TOUCH_TRACE stage=%s qa=%u page=%u full=%u header=%u blocked=%u button=%u "
                      "start=%d,%d end=%d,%d ms=%lu samples=%lu consumed=%u action=%u "
                      "raw_start=%d,%d raw_end=%d,%d raw_ms=%lu raw_updates=%lu pointers=%u bindings=%u",
                      stage, t.qa, t.page, t.fullscreen, t.header, t.blocked, t.button,
                      t.start_x, t.start_y, t.end_x, t.end_y,
                      static_cast<unsigned long>(t.duration), static_cast<unsigned long>(t.samples),
                      t.consumed, t.action, t.raw_start_x, t.raw_start_y, t.raw_end_x, t.raw_end_y,
                      static_cast<unsigned long>(t.raw_duration), static_cast<unsigned long>(t.raw_updates),
                      t.pointers, t.bindings);
                });
            id(lcd_navigation_ready) = true;
        - script.execute:
            id: set_lcd_navigation_mode
            fullscreen: !lambda |-
              return usp_lcd_gesture::fullscreen_mode(id(lcd_navigation_mode_value));


    - priority: -100
      then:
        - script.execute: refresh_wifi_icon
        - script.execute: refresh_lcd_navigation
        - lambda: |-
            id(ui_selected_region_id) =
                id(region_settings).selected_region_id();
            id(ui_alert_palette) = usp_alert_palette::sanitize_mode(
                id(ui_alert_palette));
            ESP_LOGI(
                "usp.region.persist",
                "Boot UI region id=%u",
                id(ui_selected_region_id));
        - delay: 1500ms
        - script.execute: apply_ui_language
        - script.execute: refresh_selected_region_name_ui

        - if:
            condition:
              lambda: |-
                return id(ui_language) == 0;
            then:
              - lvgl.button.update:
                  id: lang_ua_button
                  bg_color: 0x2563EB

              - lvgl.button.update:
                  id: lang_ru_button
                  bg_color: 0x263D57

              - lvgl.button.update:
                  id: lang_en_button
                  bg_color: 0x263D57

              - lvgl.label.update:
                  id: settings_title_label
                  text: "НАЛАШТУВАННЯ"

              - lvgl.label.update:
                  id: i18n_test_label
                  text: "Українська"

        - if:
            condition:
              lambda: |-
                return id(ui_language) == 1;
            then:
              - lvgl.button.update:
                  id: lang_ua_button
                  bg_color: 0x263D57

              - lvgl.button.update:
                  id: lang_ru_button
                  bg_color: 0x2563EB

              - lvgl.button.update:
                  id: lang_en_button
                  bg_color: 0x263D57

              - lvgl.label.update:
                  id: settings_title_label
                  text: "НАСТРОЙКИ"

              - lvgl.label.update:
                  id: i18n_test_label
                  text: "Русский"

        - if:
            condition:
              lambda: |-
                return id(ui_language) == 2;
            then:
              - lvgl.button.update:
                  id: lang_ua_button
                  bg_color: 0x263D57

              - lvgl.button.update:
                  id: lang_ru_button
                  bg_color: 0x263D57

              - lvgl.button.update:
                  id: lang_en_button
                  bg_color: 0x2563EB

              - lvgl.label.update:
                  id: settings_title_label
                  text: "SETTINGS"

              - lvgl.label.update:
                  id: i18n_test_label
                  text: "English"

interval:
  - interval: 5s
    then:
      - script.execute: refresh_settings_network

  - interval: 16ms
    then:
      - lambda: |-
          if (!id(lcd_navigation_ready)) return;
          const auto action = usp_lcd_navigation::controller().take_action();
          if (action == usp_lcd_gesture::Action::NONE) return;
          if (action == usp_lcd_gesture::Action::MENU) {
            usp_lcd_navigation::hidden(id(lcd_navigation_menu), false);
            ESP_LOGI("usp.navigation", "LCD_ESCAPE menu=OPEN");
            return;
          }
          uint8_t page = id(lcd_navigation_page);
          if (page == 6) page = 1;
          if (page == 7) page = 2;
          const auto next = usp_lcd_gesture::adjacent_page(page, action);
          ESP_LOGI("usp.navigation", "LCD_SWIPE from=%u to=%u", page, next);
          if (next != page) id(navigate_lcd_page).execute(next);
  - interval: 1s
    then:
      - script.execute: refresh_lcd_fullscreen_context
      - script.execute: refresh_wifi_icon
      - script.execute: refresh_clock_time
      - script.execute: refresh_clock_context
  - interval: 5min
    then:
      - lambda: |-
          const auto now = id(panel_time).now();
          if (!now.is_valid()) return;
          const bool valid = id(environment_sht4x).detected()
              && id(environment_sht4x).last_read_ok()
              && std::isfinite(id(environment_temperature).state)
              && std::isfinite(id(environment_humidity).state);
          id(room_history).record(
              static_cast<uint32_t>(now.timestamp),
              id(environment_temperature).state,
              id(environment_humidity).state,
              valid);
          if (id(clock_sntp_synced)) {
            id(room_aggregate_history).record(
                static_cast<uint32_t>(now.timestamp),
                now.year,
                now.day_of_year,
                now.hour,
                id(environment_temperature).state,
                id(environment_humidity).state,
                valid);
          }
      - script.execute: schedule_room_graph_refresh
  - interval: 5s
    then:
      - lambda: |-
          static bool ip_synced = false;
          static bool ssid_synced = false;

          auto *wifi =
              ::esphome::wifi::global_wifi_component;

          if (wifi == nullptr) {
            return;
          }

          if (!wifi->is_connected()) {
            ip_synced = false;
            ssid_synced = false;
            return;
          }

          if (!ip_synced) {
            auto ips =
                wifi->get_ip_addresses();

            if (ips[0].is_set()) {
              char ip_buf[
                  ::esphome::network::
                      IP_ADDRESS_BUFFER_SIZE
              ];

              ips[0].str_to(ip_buf);

              id(panel_ip_address).
                  publish_state(ip_buf);

              ip_synced = true;

              ESP_LOGI(
                  "main",
                  "Network sync IP: %s",
                  ip_buf);
            }
          }

          if (!ssid_synced) {
            auto sta =
                wifi->get_sta();

            auto ssid =
                sta.get_ssid();

            if (!ssid.empty()) {
              id(panel_wifi_ssid).
                  publish_state(
                      ssid.c_str(),
                      ssid.size());

              ssid_synced = true;

              ESP_LOGI(
                  "main",
                  "Network sync SSID: %s",
                  ssid.c_str());
            }
          }


  - interval: 1s
    then:
      # The clock legitimately changes every second. Keep the date and outage
      # paths change-driven so unchanged labels/timeline objects are not
      # invalidated repeatedly by LVGL.
      - delay: 1ms
      - lvgl.label.update:
          id: header_clock_label
          text: !lambda |-
            const auto now = id(panel_time).now();
            if (!now.is_valid()) return std::string("--:--:--");
            char value[16];
            std::snprintf(value, sizeof(value), "%02d:%02d:%02d",
                now.hour, now.minute, now.second);
            return std::string(value);

      - if:
          condition:
            lambda: |-
              static uint32_t last_date_key = 0xFFFFFFFFU;
              const auto now = id(panel_time).now();
              const uint32_t key = now.is_valid()
                  ? static_cast<uint32_t>(now.year) * 512U
                      + static_cast<uint32_t>(now.month) * 32U
                      + static_cast<uint32_t>(now.day_of_month)
                  : 0U;
              if (key == last_date_key) return false;
              last_date_key = key;
              return true;
          then:
            - delay: 1ms
            - lvgl.label.update:
                id: header_date_label
                text: !lambda |-
                  const auto now = id(panel_time).now();
                  if (!now.is_valid()) return std::string("--.--.----");
                  char value[16];
                  std::snprintf(value, sizeof(value), "%02d.%02d.%04d",
                      now.day_of_month, now.month, now.year);
                  return std::string(value);

      - if:
          condition:
            lambda: |-
              static uint32_t last_minute_key = 0xFFFFFFFFU;
              const auto now = id(panel_time).now();
              if (!now.is_valid()) return false;
              const uint32_t key =
                  static_cast<uint32_t>(now.year) * 535680U
                  + static_cast<uint32_t>(now.day_of_year) * 1440U
                  + static_cast<uint32_t>(now.hour) * 60U
                  + static_cast<uint32_t>(now.minute);
              if (key == last_minute_key) return false;
              last_minute_key = key;
              return true;
          then:
            - script.execute: refresh_outage_ui
            - if:
                condition:
                  lvgl.page.is_showing:
                    id: page_home
                then:
                  - script.execute: schedule_dashboard_outage_refresh

  - interval: 5s
    then:
      - script.execute: alert_freshness_check

external_components:
  - source:
      type: local
      path: ../components
    components:
      - gt911
      - mipi_rgb
      - lvgl
      - logger
      - json
      - captive_portal
      - esp32
      - usp_region
      - usp_weather
      - usp_outage
      - usp_optional_sht4x
      - usp_room_history
      - usp_room_aggregate_history
      - usp_alarm
      # Read-only Shelly transport stays available in public-first firmware,
      # but public profile has no host/password controls and leaves it disabled.
      - usp_shelly_em
      - usp_neptun
      - usp_history

esp32:
  board: esp32-s3-devkitc-1
  flash_size: 16MB
  framework:
    type: esp-idf
    advanced:
      loop_task_stack_size: 12288
      # Make the already-active ESPHome rollback policy explicit. Rollback
      # requires OTA plus safe_mode and is verified from generated sdkconfig.
      enable_ota_rollback: true
    sdkconfig_options:
      # RGB bounce copies need 64-byte cache lines (Espressif LCD FAQ).
      # Keep the cache at 32 KiB to preserve the internal heap budget.
      CONFIG_ESP32S3_DATA_CACHE_LINE_32B: "n"
      CONFIG_ESP32S3_DATA_CACHE_LINE_64B: "y"
      CONFIG_ESP32S3_DATA_CACHE_32KB: "y"
      CONFIG_ESP_TLS_CLIENT_SESSION_TICKETS: "y"
      # TLS buffers do not fit the remaining internal heap. Keep certificates
      # verified and allocate mbedTLS working memory from available PSRAM.
      CONFIG_MBEDTLS_INTERNAL_MEM_ALLOC: "n"
      CONFIG_MBEDTLS_EXTERNAL_MEM_ALLOC: "y"

psram:
  mode: octal
  speed: 80MHz

logger:
  # Keep DEBUG code compiled for temporary diagnostics, but run production at
  # INFO unless the authenticated Web Debug Mode is explicitly enabled.
  level: DEBUG
  hardware_uart: UART0
  # Keep serial diagnostics, but avoid main-loop stalls while draining the
  # 768-byte worker log ring. 115200 baud alone can consume ~67 ms for a
  # full burst before formatting/API callback overhead is counted.
  baud_rate: 460800


usp_weather:
  id: weather_client
  refresh_interval: 15min
  stale_after: 45min
  initial_delay: 12s
  on_update:
    then:
      - lambda: id(home_native_frame_data_generation)++;
      - script.execute: refresh_weather_ui
      - script.execute: schedule_dashboard_weather_refresh
      - script.execute: refresh_clock_context
      - script.execute: schedule_room_current_refresh

usp_outage:
  id: outage_client
  time_id: panel_time
  refresh_interval: 15min
  stale_after: 45min
  initial_delay: 18s
  on_update:
    then:
      - lambda: id(home_native_frame_data_generation)++;
      - script.execute: refresh_outage_ui
      - script.execute: schedule_dashboard_outage_refresh
      - lambda: |-
          if (id(outage_client).schedule_valid()
              && id(outage_client).tomorrow_valid()) {
            id(history_store).record_schedule(
                id(outage_client).group_label(),
                id(outage_client).today_outage_minutes(),
                id(outage_client).tomorrow_outage_minutes());
          }


# Read-only monitor. Public-first has no runtime credentials/host controls, so
# the client remains disabled until production settings explicitly enable it.
usp_shelly_em:
  id: shelly_em_client
  refresh_interval: 10s
  initial_delay: 8s
  connect_timeout: 1800ms
  on_update:
    then:
      - script.execute: refresh_shelly_power_ui

usp_neptun:
  id: neptun_client
  # Regional alerts are primary, so keep polling even without target details.
  # Twenty seconds respects the provider minimum interval.
  refresh_interval: 20s
  idle_refresh_interval: 20s
  stale_after: 120s
  initial_delay: 24s
  on_update:
    then:
      - script.execute: refresh_neptun_ui
      - script.execute: refresh_selected_neptun_ui
      - script.execute: schedule_fullscreen_threat_icons_refresh
      # Re-evaluate source selection immediately when a fresh regional snapshot
      # arrives instead of waiting for the next 5-second watchdog tick.
      - script.execute: alert_freshness_check




usp_alarm:
  id: personal_alarms
  time_id: panel_time
  trusted: !lambda return id(clock_sntp_synced);
  on_update:
    - script.execute: refresh_alarm_state
  on_alarm:
    - lambda: id(alarm_popup_was_open) = true;
    - script.execute: alarm_audio_loop
    - script.execute: refresh_alarm_state

usp_room_history:
  id: room_history

usp_room_aggregate_history:
  id: room_aggregate_history

usp_history:
  id: history_store
  time_id: panel_time
  commit_delay: 5s
  on_update:
    then:
      - lambda: id(home_native_frame_data_generation)++;
      - script.execute: refresh_history_ui
      - script.execute: schedule_dashboard_history_refresh

usp_region:
  id: region_settings

safe_mode:
  boot_is_good_after: 1min
  num_attempts: 10
  reboot_timeout: 5min
  # Confirm the image only after the healthy one-minute window.
  boot_is_good_on_shutdown: false

# No network firmware upload in the public USB provisioning profile.

# Public first-flash image: no private Wi-Fi credentials are embedded.
wifi:
  on_connect:
    - script.execute: refresh_wifi_icon
  on_disconnect:
    - lambda: id(panel_wifi_rssi_valid) = false;
    - script.execute: refresh_wifi_icon
  ap:
    ssid: "${friendly_name} Setup"
    ap_timeout: 15s

captive_portal:

improv_serial:

# Close bootstrap provisioning transports after a bounded setup window.
provisioning:
  timeout: 15min


# Shared bus: CH32V003 helper MCU + GT911 touchscreen.
i2c:
  id: bus_a
  sda: GPIO8
  scl: GPIO9
  frequency: 400kHz
  scan: true

# Waveshare 7B helper MCU.
waveshare_io_ch32v003:
  - id: wave_hub
    address: 0x24
    i2c_id: bus_a

# LCD VDD/VCOM enable and USB/CAN selector.
switch:
  - platform: gpio
    id: lcd_vdd_enable
    internal: true
    restore_mode: ALWAYS_ON
    pin:
      waveshare_io_ch32v003: wave_hub
      number: 6
      mode: OUTPUT

  - platform: gpio
    id: backlight_gate
    internal: true
    restore_mode: ALWAYS_ON
    pin:
      waveshare_io_ch32v003: wave_hub
      number: 2
      mode:
        output: true
        input: false
      inverted: false

  - platform: gpio
    id: usb_can_select
    internal: true
    restore_mode: ALWAYS_OFF
    pin:
      waveshare_io_ch32v003: wave_hub
      number: 5
      mode: OUTPUT

  # Battery presence cannot be inferred from voltage: with no cell installed,
  # the board still reports the charger rail near 4.1 V. Persist an explicit
  # user setting and never synthesize a charging state from ADC voltage.
  - platform: template
    id: web_battery_installed
    name: "Battery Installed"
    entity_category: config
    restore_mode: RESTORE_DEFAULT_OFF
    optimistic: true
    turn_on_action:
      - delay: 10ms
      - script.execute: refresh_battery_ui
    turn_off_action:
      - delay: 10ms
      - script.execute: refresh_battery_ui





# EXIO2 enables the LCD/backlight power path.
output:
  # Solderless passive buzzer module on the HY2.0-3P Sensor connector.
  # GPIO6 only drives the module input; use a module with a transistor driver.
  - platform: ledc
    id: buzzer_pwm
    pin: GPIO6
    frequency: 2kHz
    zero_means_zero: true

  - platform: waveshare_io_ch32v003
    waveshare_io_ch32v003_id: wave_hub
    id: backlight_pwm
    inverted: true
    zero_means_zero: true
    safe_pwm_levels:
      min_value: 1
      max_value: 247

rtttl:
  id: panel_buzzer
  output: buzzer_pwm
  gain: 30%

light:
  - platform: monochromatic
    id: backlight
    name: "Panel Backlight"
    output: backlight_pwm
    restore_mode: ALWAYS_ON
    default_transition_length: 0s
    on_state:
      - lambda: |-
          const float percent = std::clamp(
              id(backlight).remote_values.get_brightness() * 100.0f,
              0.0f, 100.0f);
          id(ui_backlight_percent) = percent;
      - if:
          condition:
            lambda: return millis() > 2000U;
          then:
            - script.execute: sync_backlight_setting_ui

# Browser-safe configuration entities. They read the existing persisted state
# and mutate it only through the shared settings facade validated in 0.115.134.
select:
  - platform: template
    id: lcd_navigation_mode_select
    name: "LCD Mode"
    entity_category: config
    options:
      - "Buttons"
      - "Fullscreen"
    update_interval: 1s
    lambda: |-
      return std::string(usp_lcd_gesture::fullscreen_mode(
          id(lcd_navigation_mode_value)) ? "Fullscreen" : "Buttons");
    set_action:
      - script.execute:
          id: set_lcd_navigation_mode
          fullscreen: !lambda return x == "Fullscreen";


  - platform: template
    id: web_ui_language_select
    name: "UI Language"
    entity_category: config
    options:
      - "Українська"
      - "Русский"
      - "English"
    update_interval: 5s
    lambda: |-
      if (id(ui_language) == 0U) return std::string("Українська");
      if (id(ui_language) == 1U) return std::string("Русский");
      return std::string("English");
    set_action:
      - script.execute:
          id: set_ui_language
          language: !lambda |-
            if (x == "Українська") return 0;
            if (x == "Русский") return 1;
            return 2;

  - platform: template
    id: web_alert_palette_select
    name: "Alert Palette"
    entity_category: config
    options:
      - "Standard"
      - "CVD-friendly"
      - "Monochrome"
    update_interval: 5s
    lambda: |-
      const uint8_t mode = usp_alert_palette::sanitize_mode(
          id(ui_alert_palette));
      if (mode == 1U) return std::string("CVD-friendly");
      if (mode == 2U) return std::string("Monochrome");
      return std::string("Standard");
    set_action:
      - script.execute:
          id: set_alert_palette
          mode: !lambda |-
            if (x == "CVD-friendly") return 1;
            if (x == "Monochrome") return 2;
            return 0;

number:


