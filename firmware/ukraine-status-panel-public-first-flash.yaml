  - id: refresh_alert_palette_controls
    mode: restart
    then:
      - lambda: |-
          const uint8_t mode = usp_alert_palette::sanitize_mode(
              id(ui_alert_palette));
          const uint32_t active = 0x2563EB;
          const uint32_t idle = 0x263D57;
          lv_obj_set_style_bg_color(
              id(palette_standard_button),
              lv_color_hex(mode == 0 ? active : idle), LV_PART_MAIN);
          lv_obj_set_style_bg_color(
