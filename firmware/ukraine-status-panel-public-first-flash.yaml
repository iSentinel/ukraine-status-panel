lvgl:
  - id: panel_lvgl
    debug_outline: ${lvgl_debug_outline}
    displays:
      - panel

    bg_color: 0x07111F
    bg_opa: 100%

    # Explicit application styles override LVGL's generic light card defaults.
    theme:
      dark_mode: true
      obj:
        pad_all: 0
        text_color: 0xF8FAFC
      label:
        text_color: 0xF8FAFC
      button:
        pad_all: 0
        shadow_width: 0
        text_color: 0xF8FAFC

    default_font: montserrat_24

    update_interval: 1s
    refresh_interval: 16ms
    color_depth: 16
    full_refresh: false
    update_when_display_idle: false
    draw_rounding: 2
    buffer_size: 0.0
    log_level: WARN
    page_wrap: false
    byte_order: little_endian

    touchscreens:
      - touchscreen_id: panel_touch
        long_press_time: 400ms
        long_press_repeat_time: 100ms

    on_pause:
      - light.turn_off:
          id: backlight
          transition_length: 0ms

    on_resume:
      - light.turn_on:
          id: backlight
          transition_length: 0ms

    top_layer:
      widgets:
        - obj:
            id: lcd_navigation_bar
            x: 12
            y: 534
            width: 1000
            height: 54
            pad_all: 0
            border_width: 0
            radius: 0
            bg_color: 0x07111F
            scrollable: false
            widgets:
              - button:
                  id: lcd_nav_home
                  pad_all: 0
                  x: 0
                  y: 0
                  width: 118
                  height: 54
                  radius: 12
                  bg_color: 0x2563EB
                  text: "Огляд"
                  text_font: usp_i18n_18
                  on_click:
                    - script.execute:
                        id: navigate_lcd_page
                        page: 0
              - button:
                  id: lcd_nav_map
                  pad_all: 0
                  x: 126
                  y: 0
                  width: 118
                  height: 54
                  radius: 12
                  bg_color: 0x16263A
                  text: "Карта"
                  text_font: usp_i18n_18
                  on_click:
                    - script.execute:
                        id: navigate_lcd_page
                        page: 1
              - button:
                  id: lcd_nav_weather
                  pad_all: 0
                  x: 252
                  y: 0
                  width: 118
                  height: 54
                  radius: 12
                  bg_color: 0x16263A
                  text: "Погода"
                  text_font: usp_i18n_18
                  on_click:
                    - script.execute:
                        id: navigate_lcd_page
                        page: 2
              - button:
                  id: lcd_nav_power
                  pad_all: 0
                  x: 378
                  y: 0
                  width: 118
                  height: 54
                  radius: 12
                  bg_color: 0x16263A
                  text: "Живлення"
                  text_font: usp_i18n_18
                  on_click:
                    - script.execute:
                        id: navigate_lcd_page
                        page: 3
              - button:
                  id: lcd_nav_history
                  pad_all: 0
                  x: 504
                  y: 0
                  width: 118
                  height: 54
                  radius: 12
                  bg_color: 0x16263A
                  text: "Історія"
                  text_font: usp_i18n_18
                  on_click:
                    - script.execute:
                        id: navigate_lcd_page
                        page: 4
              - button:
                  id: lcd_nav_spotify
                  pad_all: 0
                  x: 630
                  y: 0
                  width: 118
                  height: 54
                  radius: 12
                  bg_color: 0x16263A
                  text: "Spotify"
                  text_font: usp_i18n_18
                  on_click:
                    - script.execute:
                        id: navigate_lcd_page
                        page: 12
              - button:
                  id: lcd_nav_clock
                  pad_all: 0
                  x: 756
                  y: 0
                  width: 118
                  height: 54
                  radius: 12
                  bg_color: 0x16263A
                  text: "Годинник"
                  text_font: usp_i18n_18
                  on_click:
                    - script.execute:
                        id: navigate_lcd_page
                        page: 9
              - button:
                  id: lcd_nav_settings
                  pad_all: 0
                  x: 882
                  y: 0
                  width: 118
                  height: 54
                  radius: 12
                  bg_color: 0x16263A
                  text: "Налашт."
                  text_font: usp_i18n_18
                  on_click:
                    - script.execute:
                        id: navigate_lcd_page
                        page: 5

        - label:
            id: lcd_fullscreen_context
            x: 12
            y: 574
            width: 1000
            height: 26
            bg_color: 0x07111F
            bg_opa: 100%
            text_color: 0xF8FAFC
            text_font: usp_i18n_18
            long_mode: DOT
            text: ""
            hidden: true
        - label:
            id: lcd_map_region_context
            x: 28
            y: 14
            width: 250
            height: 30
            bg_color: 0x07111F
            bg_opa: 100%
            text_color: 0xF8FAFC
            text_font: usp_i18n_22
            long_mode: DOT
            text: ""
            hidden: true
        - obj:
            id: lcd_navigation_escape_zone
            x: 0
            y: 0
            width: 300
            height: 64
            bg_opa: 0%
            border_width: 0
            pad_all: 0
            clickable: true
            scrollable: false
            hidden: true
        - obj:
            id: lcd_navigation_menu
            x: 0
            y: 0
            width: 1024
            height: 600
            bg_color: 0x07111F
            bg_opa: 100%
            border_width: 0
            pad_all: 0
            clickable: true
            scrollable: false
            hidden: true
            widgets:
              - label:
                  id: lcd_navigation_menu_title
                  x: 160
                  y: 120
                  width: 704
                  text: "Навігація"
                  text_font: usp_i18n_32
              - label:
                  id: lcd_navigation_menu_help
                  x: 160
                  y: 188
                  width: 704
                  height: 100
                  text: "Свайп вліво / вправо: екрани по колу."
                  text_font: usp_i18n_22
              - button:
                  id: lcd_navigation_menu_settings
                  x: 160
                  y: 328
                  width: 216
                  height: 56
                  text: "Налаштування"
                  text_font: usp_i18n_18
                  on_click:
                    - lambda: usp_lcd_navigation::hidden(id(lcd_navigation_menu), true);
                    - script.execute:
                        id: navigate_lcd_page
                        page: 5
              - button:
                  id: lcd_navigation_menu_buttons
                  x: 400
                  y: 328
