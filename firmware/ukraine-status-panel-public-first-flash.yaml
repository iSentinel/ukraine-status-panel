  - id: refresh_dashboard_outage_ui
    mode: restart
    then:
      # Decouple this child script from the parent scheduler action.
      - delay: 1ms
      - lvgl.label.update:
          id: dashboard_group_label
          text: !lambda |-
            return id(outage_client).configured()
                ? id(outage_client).group_label() : std::string("--");
      - lvgl.label.update:
          id: dashboard_outage_group_label
          text: !lambda |-
            return usp_ui_i18n::outage_group_label(
                id(outage_client).group_label(),
                id(outage_client).configured(),
                id(ui_language));
      - lvgl.label.update:
          id: dashboard_outage_status_label
          text: !lambda |-
            return usp_ui_i18n::compact_outage_status(
                id(outage_client).configured(),
                id(outage_client).schedule_valid(),
                id(outage_client).schedule_stale(),
                id(outage_client).last_fetch_ok(),
                id(outage_client).today_status(), id(ui_language));
      # Yield between label-layout phases.
      - delay: 1ms
      - lvgl.label.update:
          id: dashboard_outage_summary_label
          text: !lambda |-
            if (!id(outage_client).schedule_valid()) {
              return std::string("--");
            }
            const auto now = id(panel_time).now();
            if (!now.is_valid()) return std::string("--");
            const int minute = now.hour * 60 + now.minute;
            int next = -1;
            const size_t count = id(outage_client).today_slot_count();
            for (size_t i = 0; i < count; ++i) {
              if (id(outage_client).today_slot_type(i) != 2) continue;
              const int start = id(outage_client).today_slot_start(i);
              const int end = id(outage_client).today_slot_end(i);
              if (minute >= start && minute < end) { next = end; break; }
              if (start > minute) { next = start; break; }
            }
            if (next < 0) {
              return usp_ui_i18n::compact_outage_no_changes(id(ui_language));
            }
            const int delta = next - minute;
            return usp_ui_i18n::compact_relative_change(
                delta, id(ui_language));
      # Timeline geometry is a separate cooperative phase.
      - delay: 1ms
      - lambda: |-
          lv_obj_t *segments[8] = {
              id(dashboard_outage_seg0), id(dashboard_outage_seg1),
              id(dashboard_outage_seg2), id(dashboard_outage_seg3),
              id(dashboard_outage_seg4), id(dashboard_outage_seg5),
              id(dashboard_outage_seg6), id(dashboard_outage_seg7)};
          for (size_t index = 0; index < 8; ++index) {
            lv_obj_add_flag(segments[index], LV_OBJ_FLAG_HIDDEN);
          }
          const auto now = id(panel_time).now();
          if (!now.is_valid() || !id(outage_client).schedule_valid()) {
            lv_obj_add_flag(id(dashboard_now_marker), LV_OBJ_FLAG_HIDDEN);
          } else {
            const int minute = now.hour * 60 + now.minute;
            lv_obj_set_x(
                id(dashboard_now_marker), 18 + (360 * minute) / 1440);
            lv_obj_clear_flag(
                id(dashboard_now_marker), LV_OBJ_FLAG_HIDDEN);
          }
          if (!id(outage_client).schedule_valid()) return;
          const size_t count = std::min<size_t>(
              8, id(outage_client).today_slot_count());
          for (size_t index = 0; index < count; ++index) {
            if (id(outage_client).today_slot_type(index) != 2) continue;
            const int start = id(outage_client).today_slot_start(index);
            const int end = id(outage_client).today_slot_end(index);
            lv_obj_set_x(segments[index], 18 + (360 * start) / 1440);
            const int width = std::max(
                3, (360 * (end - start)) / 1440);
            lv_obj_set_width(segments[index], width);
            lv_obj_clear_flag(segments[index], LV_OBJ_FLAG_HIDDEN);
          }


