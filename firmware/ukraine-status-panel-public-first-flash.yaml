  - id: refresh_outage_ui
    mode: restart
    then:
      # Keep the 30 s interval callback short; render cooperatively.
      - delay: 1ms
      - lvgl.label.update:
          id: power_outage_group_label
          text: !lambda |-
            std::string prefix;
            if (id(ui_language) == 0) prefix = "ГРУПА ";
            else if (id(ui_language) == 1) prefix = "ГРУППА ";
            else prefix = "GROUP ";
            return prefix + id(outage_client).group_label();
      - lvgl.label.update:
          id: i18n_043
          text: !lambda |-
            if (!id(outage_client).configured()) {
              if (id(ui_language) == 0) return std::string("НЕ НАЛАШТОВАНО");
              if (id(ui_language) == 1) return std::string("НЕ НАСТРОЕНО");
              return std::string("NOT CONFIGURED");
            }
            if (!id(outage_client).schedule_valid()) {
              if (id(ui_language) == 0) return std::string("ОЧІКУВАННЯ");
              if (id(ui_language) == 1) return std::string("ОЖИДАНИЕ");
              return std::string("WAITING");
            }
            if (id(outage_client).schedule_stale()) {
              if (id(ui_language) == 0) {
                return std::string("Застарілі дані");
              }
              if (id(ui_language) == 1) {
                return std::string("Устаревшие данные");
              }
              return std::string("Stale data");
            }
            if (!id(outage_client).last_fetch_ok()) {
              if (id(ui_language) == 0) {
                return std::string("Кешовані дані");
              }
              if (id(ui_language) == 1) {
                return std::string("Кэшированные данные");
              }
              return std::string("Cached data");
            }
            return id(outage_client).today_status_text(id(ui_language));
      - lvgl.label.update:
          id: i18n_044
          text: !lambda |-
            if (!id(outage_client).configured()) {
              if (id(ui_language) == 0) {
                return std::string("Оберіть групу кнопками - / +");
              }
              if (id(ui_language) == 1) {
                return std::string("Выберите группу кнопками - / +");
              }
              return std::string("Select a group with - / +");
            }
            if (!id(outage_client).schedule_valid()) {
              if (id(ui_language) == 0) {
                return std::string("Завантаження графіка...");
              }
              if (id(ui_language) == 1) {
                return std::string("Загрузка графика...");
              }
              return std::string("Loading schedule...");
            }
            const int today = id(outage_client).today_outage_minutes();
            const int tomorrow = id(outage_client).tomorrow_valid()
                ? id(outage_client).tomorrow_outage_minutes() : -1;
            return usp_ui_i18n::outage_day_summary(
                today, tomorrow, id(ui_language));
      - lvgl.label.update:
          id: power_outage_next_label
          text: !lambda |-
            std::string prefix;
            if (id(ui_language) == 0) prefix = "Наступне: ";
            else if (id(ui_language) == 1) prefix = "Следующее: ";
            else prefix = "Next: ";
            if (!id(outage_client).schedule_valid()) return prefix + "--";
            const auto now = id(panel_time).now();
            if (!now.is_valid()) return prefix + "--";
            const int minute = now.hour * 60 + now.minute;
            const int start = id(outage_client).next_outage_start(minute);
            const int end = id(outage_client).next_outage_end(minute);
            if (start < 0 || end < 0) {
              if (id(ui_language) == 0) return prefix + "сьогодні немає";
              if (id(ui_language) == 1) return prefix + "сегодня нет";
              return prefix + "none today";
            }
            char value[32];
            std::snprintf(
                value, sizeof(value), "%02d:%02d-%02d:%02d",
                start / 60, start % 60, end / 60, end % 60);
            return prefix + value;
      - delay: 1ms
      - lvgl.label.update:
          id: power_outage_provider_label
          text: !lambda |-
            if (!id(outage_client).configured()) {
              if (id(ui_language) == 0) {
                return std::string("Yasno · не налаштовано");
              }
              if (id(ui_language) == 1) {
                return std::string("Yasno · не настроено");
              }
              return std::string("Yasno · not configured");
            }
            if (!id(outage_client).schedule_valid()) {
              if (id(ui_language) == 0) {
                return std::string("Yasno · очікування");
              }
              if (id(ui_language) == 1) {
                return std::string("Yasno · ожидание");
              }
              return std::string("Yasno · waiting");
            }
            if (id(outage_client).schedule_stale()) {
              if (id(ui_language) == 0) {
                return std::string("Yasno · застарілий кеш");
              }
              if (id(ui_language) == 1) {
                return std::string("Yasno · устаревший кэш");
              }
              return std::string("Yasno · stale cache");
            }
            if (!id(outage_client).last_fetch_ok()) {
              if (id(ui_language) == 0) {
                return std::string("Yasno · кеш");
              }
              if (id(ui_language) == 1) {
                return std::string("Yasno · кэш");
              }
              return std::string("Yasno · cached");
            }
            return usp_ui_i18n::yasno_live_status(id(ui_language));
      - lambda: |-
          uint32_t color = 0xFACC15;
          if (!id(outage_client).configured()) {
            color = 0x90A4B8;
          } else if (id(outage_client).schedule_valid()
                     && !id(outage_client).schedule_stale()
                     && id(outage_client).last_fetch_ok()) {
            color = 0x4ADE80;
          }
          lv_obj_set_style_text_color(
              id(power_outage_provider_label),
              lv_color_hex(color), LV_PART_MAIN);
      - lvgl.label.update:
          id: power_outage_updated_label
          text: !lambda |-
            std::string prefix;
            if (id(ui_language) == 0) prefix = "Оновлено: ";
            else if (id(ui_language) == 1) prefix = "Обновлено: ";
            else prefix = "Updated: ";
            const std::string value = id(outage_client).provider_updated();
            return prefix + (value.empty() ? "--" : value);
      - lvgl.button.update:
          id: power_outage_refresh_button
          text: !lambda |-
            if (id(ui_language) == 0) return std::string("ОНОВИТИ");
            if (id(ui_language) == 1) return std::string("ОБНОВИТЬ");
            return std::string("REFRESH");
      - delay: 1ms
      - lambda: |-
          lv_obj_t *segments[8] = {
              id(power_outage_seg0), id(power_outage_seg1),
              id(power_outage_seg2), id(power_outage_seg3),
              id(power_outage_seg4), id(power_outage_seg5),
              id(power_outage_seg6), id(power_outage_seg7)};
          for (size_t index = 0; index < 8; ++index) {
            lv_obj_add_flag(segments[index], LV_OBJ_FLAG_HIDDEN);
          }
          if (!id(outage_client).schedule_valid()) return;
          const size_t count = std::min<size_t>(
              8, id(outage_client).today_slot_count());
          for (size_t index = 0; index < count; ++index) {
            if (id(outage_client).today_slot_type(index) != 2) continue;
            const int start = id(outage_client).today_slot_start(index);
            const int end = id(outage_client).today_slot_end(index);
            const int x = 20 + (900 * start) / 1440;
            const int width = std::max(3, (900 * (end - start)) / 1440);
            lv_obj_set_x(segments[index], x);
            lv_obj_set_width(segments[index], width);
            lv_obj_clear_flag(segments[index], LV_OBJ_FLAG_HIDDEN);
          }

