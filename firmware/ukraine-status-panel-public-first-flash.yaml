                  return lv_color_hex(
                      id(ui_sound_enabled) ? 0x166534 : 0x263D57);
                text: !lambda |-
                  if (id(ui_language) == 0U) {
                    return id(ui_sound_enabled) ? std::string(usp_sound_controls_text::label(id(ui_language), usp_sound_controls_text::Label::SOUND_ON)) : std::string(usp_sound_controls_text::label(id(ui_language), usp_sound_controls_text::Label::SOUND_OFF));
                  }
                  if (id(ui_language) == 1U) {
                    return id(ui_sound_enabled) ? std::string(usp_sound_controls_text::label(id(ui_language), usp_sound_controls_text::Label::SOUND_ON)) : std::string(usp_sound_controls_text::label(id(ui_language), usp_sound_controls_text::Label::SOUND_OFF));
                  }
                  return id(ui_sound_enabled) ? std::string(usp_sound_controls_text::label(id(ui_language), usp_sound_controls_text::Label::SOUND_ON)) : std::string(usp_sound_controls_text::label(id(ui_language), usp_sound_controls_text::Label::SOUND_OFF));
            - lvgl.button.update:
