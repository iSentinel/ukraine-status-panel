  - id: refresh_wifi_icon
    mode: restart
    then:
      # Wi-Fi events can arrive before the LCD has completed setup.
      - delay: 10ms
      - lambda: |-
          auto *wifi = ::esphome::wifi::global_wifi_component;
          const bool connected = wifi != nullptr && wifi->is_connected();
          const bool sample_valid = connected
              && id(panel_wifi_rssi_valid)
              && id(panel_wifi_rssi).has_state()
              && std::isfinite(id(panel_wifi_rssi).state);
          const int rssi = sample_valid
              ? static_cast<int>(std::lround(id(panel_wifi_rssi).state))
              : -127;
          if (usp_wifi_icon::controller().update(
                  id(dashboard_wifi_bar_1), id(dashboard_wifi_bar_2),
                  id(dashboard_wifi_bar_3), id(dashboard_wifi_bar_4),
                  connected, rssi)) {
            id(home_native_frame_data_generation)++;
          }

          // Repair visibility on every refresh. The badge is moved first so the
          // four root-level bars remain above its opaque background.
          lv_obj_clear_flag(id(dashboard_wifi_badge), LV_OBJ_FLAG_HIDDEN);
          lv_obj_move_foreground(id(dashboard_wifi_badge));
          for (auto *bar : {id(dashboard_wifi_bar_1), id(dashboard_wifi_bar_2),
                            id(dashboard_wifi_bar_3), id(dashboard_wifi_bar_4)}) {
            lv_obj_clear_flag(bar, LV_OBJ_FLAG_HIDDEN);
            lv_obj_move_foreground(bar);
          }
          usp_lcd_navigation::label_text(id(dashboard_wifi_badge), "WiFi");
          usp_lcd_navigation::label_color(
              id(dashboard_wifi_badge), connected ? 0x38BDF8 : 0xF87171);

          const char *status = connected
              ? (usp_wifi_status_text::label(id(ui_language), usp_wifi_status_text::Label::ONLINE))
              : (usp_wifi_status_text::label(id(ui_language), usp_wifi_status_text::Label::OFFLINE));
          usp_lcd_navigation::label_text(id(dashboard_wifi_label), status);
          const uint32_t text_rgb = connected ? 0x4ADE80 : 0xF87171;
          const uint32_t bg_rgb = connected ? 0x123B2A : 0x3B1820;
          usp_lcd_navigation::label_color(id(dashboard_wifi_label), text_rgb);
          if (!lv_color_eq(
                  lv_obj_get_style_bg_color(id(dashboard_wifi_label), LV_PART_MAIN),
                  lv_color_hex(bg_rgb))) {
            lv_obj_set_style_bg_color(
                id(dashboard_wifi_label), lv_color_hex(bg_rgb), LV_PART_MAIN);
          }

  - id: refresh_battery_ui
    mode: restart
    then:
      - lambda: |-
          const bool installed = id(web_battery_installed).state;
          const float voltage = id(panel_battery_voltage).state;
          const auto state = usp_battery_model::state(installed, voltage);
          const float percent = usp_battery_model::estimate_percent(voltage);

          char compact[28];
          if (!installed) {
            std::snprintf(compact, sizeof(compact), "NO BAT");
          } else if (!std::isfinite(percent) || !std::isfinite(voltage)) {
            std::snprintf(compact, sizeof(compact), "--%% · -- V");
          } else {
            std::snprintf(compact, sizeof(compact), "%.0f%% · %.2f V", percent, voltage);
          }
