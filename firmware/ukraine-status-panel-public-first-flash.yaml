              id(selected_threat_supported) != value.supported ||
              id(selected_threat_state) != value.state || id(selected_threat_flags) != value.flags;
          id(selected_threat_valid) = value.valid;
          id(selected_threat_supported) = value.supported;
          id(selected_threat_state) = value.state;
          id(selected_threat_flags) = value.flags;
          id(selected_threat_sequence) = value.sequence;
