    step: 1
    update_interval: 5s
    lambda: |-
      return static_cast<float>(id(outage_client).group_number());
    set_action:
      - script.execute:
          id: set_outage_group
          group: !lambda return static_cast<int>(x);


# RGB565 1024x600 panel.
# mipi_rgb is preferred over deprecated rpi_dpi_rgb in ESPHome 2026.9.1.
display:
  - platform: mipi_rgb
    model: RPI
    id: panel
    update_interval: never
    auto_clear_enabled: false

    dimensions:
      width: 1024
      height: 600

    color_order: RGB
    pclk_frequency: 20MHz
    pclk_inverted: true

    de_pin: GPIO5

    hsync_pin:
      number: GPIO46
      ignore_strapping_warning: true

    vsync_pin:
      number: GPIO3
      ignore_strapping_warning: true

    pclk_pin: GPIO7

    reset_pin:
      waveshare_io_ch32v003: wave_hub
      number: 3
      mode: OUTPUT

    # Timings from Waveshare 7B RGB reference implementation.
    hsync_pulse_width: 162
    hsync_back_porch: 152
    hsync_front_porch: 48

    vsync_pulse_width: 45
    vsync_back_porch: 13
    vsync_front_porch: 3

    data_pins:
      red:
        - GPIO1
        - GPIO2
        - GPIO42
        - GPIO41
        - GPIO40

      green:
        - GPIO39
        - GPIO0
        - GPIO45
        - GPIO48
        - GPIO47
        - GPIO21

      blue:
        - GPIO14
        - GPIO38
        - GPIO18
        - GPIO17
        - GPIO10


# GT911 capacitive touch.

touchscreen:
  - platform: gt911
    id: panel_touch
    display: panel
    i2c_id: bus_a
    update_interval: 50ms

    interrupt_pin: GPIO4
    # Cancel an untrusted touch before it can become a button click.
    on_cancel:
      then:
        - lambda: usp_lcd_navigation::controller().cancel_touch_fault();
    # Record only while an explicit, time-limited diagnostic is armed.
    on_update:
      then:
        - lambda: |-
            if (touches.empty()) return;
            const auto &touch = touches[0];
            const uint32_t now = millis();
            if (touch.state == esphome::touchscreen::STATE_PRESSED) {
              usp_lcd_navigation::controller().raw_touch_press(
                  touch.x, touch.y, now);
            } else if (touch.state == esphome::touchscreen::STATE_UPDATED) {
              usp_lcd_navigation::controller().raw_touch_point(
                  touch.x, touch.y, now);
            }
    on_release:
      then:
        - lambda: usp_lcd_navigation::controller().raw_touch_release(millis());

    reset_pin:
      waveshare_io_ch32v003: wave_hub
      number: 1
      mode: OUTPUT

