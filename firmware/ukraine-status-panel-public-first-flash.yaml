                        id(dashboard_map_card), originals, 26,
                        id(alert_render_states), id(ui_alert_palette));
                then:
                  - lambda: |-
                      if (!id(dashboard_map_startup_revealed)) {
                        id(dashboard_map_startup_revealed) = true;
                        ESP_LOGI(
                            "usp.map.startup",
                            "MAP_STARTUP_REVEAL_DONE cache=dashboard");
                      }
                else:
                  # Low-PSRAM fallback keeps the previous one-mask-per-frame path.
                  - repeat:
                      count: 25
                      then:
                        - lambda: |-
                            const size_t index = static_cast<size_t>(iteration);
                            lv_obj_t *regions[25] = {
                                id(dash_region_ua_05), id(dash_region_ua_07),
                                id(dash_region_ua_09), id(dash_region_ua_12),
                                id(dash_region_ua_14), id(dash_region_ua_18),
                                id(dash_region_ua_21), id(dash_region_ua_23),
                                id(dash_region_ua_26), id(dash_region_ua_32),
                                id(dash_region_ua_35), id(dash_region_ua_43),
                                id(dash_region_ua_46), id(dash_region_ua_48),
                                id(dash_region_ua_51), id(dash_region_ua_53),
                                id(dash_region_ua_56), id(dash_region_ua_59),
                                id(dash_region_ua_61), id(dash_region_ua_63),
                                id(dash_region_ua_65), id(dash_region_ua_68),
                                id(dash_region_ua_71), id(dash_region_ua_74),
                                id(dash_region_ua_77)};
                            static uint8_t cache[25] = {};
                            static bool cache_ready = false;
                            static uint8_t palette_cache = 0xFF;
                            const uint8_t palette = usp_alert_palette::sanitize_mode(
                                id(ui_alert_palette));
                            if (iteration == 0U &&
                                (!cache_ready || palette_cache != palette)) {
                              std::fill_n(cache, 25, static_cast<uint8_t>(0xFF));
                              palette_cache = palette;
                              cache_ready = true;
                            }
                            const uint8_t state = id(alert_render_states)[index];
                            uint32_t color = usp_alert_region_colors::color_hex(
                                state, palette);
                            if (cache[index] == state) return;
                            cache[index] = state;
                            lv_obj_set_style_image_recolor(
                                regions[index], lv_color_hex(color), LV_PART_MAIN);
                        - delay: 24ms

      - if:
          condition:
