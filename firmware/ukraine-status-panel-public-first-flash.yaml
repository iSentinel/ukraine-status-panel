                  return usp_diagnostics_text::label(id(ui_language), usp_diagnostics_text::Label::PAGE_TITLE);
            - lvgl.button.update:
                id: i18n_080
                text: !lambda |-
                  return usp_diagnostics_text::label(id(ui_language), usp_diagnostics_text::Label::BACK);
            - lvgl.label.update:
                id: i18n_081
                text: !lambda |-
                  return usp_diagnostics_text::label(id(ui_language), usp_diagnostics_text::Label::HARDWARE_SECTION);
            - lvgl.label.update:
                id: i18n_082
                text: !lambda |-
                  return usp_diagnostics_text::label(id(ui_language), usp_diagnostics_text::Label::RGB_DISPLAY);
            - lvgl.label.update:
                id: diag_bounce_label
                text: !lambda |-
                  return usp_diagnostics_text::label(id(ui_language), usp_diagnostics_text::Label::BOUNCE_BUFFER);
            - lvgl.label.update:
                id: diag_bounce_value_label
                text: !lambda |-
                  return usp_diagnostics_text::label(id(ui_language), usp_diagnostics_text::Label::BOUNCE_VALUE);
            - lvgl.label.update:
                id: i18n_083
                text: !lambda |-
                  return usp_diagnostics_text::label(id(ui_language), usp_diagnostics_text::Label::TOUCH);
            - lvgl.label.update:
                id: diag_touch_label
                text: !lambda |-
                  return usp_diagnostics_text::label(id(ui_language), usp_diagnostics_text::Label::TOUCH_POLLING);
            - lvgl.label.update:
                id: i18n_084
                text: !lambda |-
                  return usp_diagnostics_text::label(id(ui_language), usp_diagnostics_text::Label::RUNTIME_SECTION);
            - lvgl.button.update:
                id: lv_touch_test
                text: !lambda |-
                  return usp_diagnostics_text::label(id(ui_language), usp_diagnostics_text::Label::TOUCH_TEST);
      - script.execute: refresh_runtime_i18n
      - script.execute: refresh_stack_i18n
      - script.execute: refresh_optional_hardware_ui

  - id: apply_ui_language
    mode: restart
    then:
      - script.execute: refresh_alarm_labels
      - script.execute: refresh_alarm_state
      - delay: 1ms
      - script.execute: refresh_lcd_navigation
      - if:
          condition:
            lvgl.page.is_showing:
              id: page_home
          then:
            - script.execute: localize_page_home
      - if:
          condition:
            lvgl.page.is_showing:
              id: page_weather
          then:
            - script.execute: localize_page_weather
      - if:
          condition:
            lvgl.page.is_showing:
              id: page_map_full
          then:
            - script.execute: localize_page_map_full
      - if:
          condition:
            lvgl.page.is_showing:
              id: page_weather_full
          then:
            - script.execute: localize_page_weather_full
      - if:
          condition:
            lvgl.page.is_showing:
              id: page_map
          then:
            - script.execute: localize_page_map
      - if:
          condition:
            lvgl.page.is_showing:
              id: page_power
          then:
            - script.execute: localize_page_power
      - if:
          condition:
            lvgl.page.is_showing:
              id: page_history
          then:
            - script.execute: localize_page_history
      - if:
          condition:
            lvgl.page.is_showing:
                id: page_room
          then:
            - script.execute: refresh_room_current_ui
            - script.execute: refresh_room_graph_ui
      - if:
          condition:
            lvgl.page.is_showing:
              id: page_settings
          then:
            - script.execute: localize_page_settings
      - if:
          condition:
            lvgl.page.is_showing:
              id: page_diagnostics
          then:
            - script.execute: localize_page_diagnostics
      - script.execute: refresh_dashboard_live_badge_i18n
      - script.execute: refresh_selected_region_name_ui
  - id: refresh_stack_i18n
    mode: restart
    then:
      - if:
          condition:
            lvgl.page.is_showing:
              id: page_diagnostics
          then:
            - lvgl.label.update:
                id: diag_stack_label
                text: !lambda |-
                  const float v =
                      id(panel_loop_stack_headroom).state;
                  const auto parts =
                      usp_diagnostics_runtime_text::parts(
                          id(ui_language),
                          usp_diagnostics_runtime_text::Field::STACK);

                  if (!std::isfinite(v)) {
                    return std::string(parts.prefix)
                        + "--" + parts.unit;
                  }

                  return std::string(parts.prefix)
                      + usp_ui::rounded_decimal(v) + parts.unit;

            - if:
                condition:
                  lambda: |-
                    const float v =
                        id(panel_loop_stack_headroom).state;
                    return !std::isfinite(v);
                then:
                  - lvgl.label.update:
                      id: diag_stack_label
                      text_color: 0x90A4B8
                else:
                  - if:
                      condition:
                        lambda: |-
                          return id(
                              panel_loop_stack_headroom
                          ).state >= 2048.0f;
                      then:
                        - lvgl.label.update:
                            id: diag_stack_label
                            text_color: 0x4ADE80
                      else:
                        - if:
                            condition:
                              lambda: |-
                                return id(
                                    panel_loop_stack_headroom
                                ).state >= 1024.0f;
                            then:
                              - lvgl.label.update:
                                  id: diag_stack_label
                                  text_color: 0xFACC15
                            else:
                              - lvgl.label.update:
                                  id: diag_stack_label
                                  text_color: 0xF87171

  - id: refresh_runtime_i18n
    mode: single
    then:
      - if:
          condition:
            lvgl.page.is_showing:
              id: page_diagnostics
          then:
            # Debounce simultaneous uptime/heap/PSRAM/voltage callbacks. With
            # mode=single, calls arriving during this short coalescing window do
            # not cancel an LVGL update already in progress. The lambdas below
            # read the latest sensor states after the delay.
            - delay: 25ms
            - lvgl.label.update:
                id: diag_uptime_label
                text: !lambda |-
                  const float v = id(panel_uptime).state;
                  const auto parts =
                      usp_diagnostics_runtime_text::parts(
                          id(ui_language),
                          usp_diagnostics_runtime_text::Field::UPTIME);

                  if (!std::isfinite(v)) {
                    return std::string(parts.prefix) + "--";
                  }

                  return std::string(parts.prefix)
                      + usp_ui::rounded_decimal(v) + parts.unit;

            - lvgl.label.update:
                id: diag_voltage_label
                text: !lambda |-
                  const float v =
                      id(panel_battery_voltage).state;
                  const auto parts =
                      usp_diagnostics_runtime_text::parts(
                          id(ui_language),
                          usp_diagnostics_runtime_text::Field::VOLTAGE);

                  if (!std::isfinite(v)) {
                    return std::string(parts.prefix) + "--";
                  }

                  return std::string(parts.prefix)
                      + usp_ui::fixed_two(v) + parts.unit;

            - lvgl.label.update:
                id: diag_heap_label
                text: !lambda |-
                  const float v =
                      id(panel_heap_free).state
                      / 1024.0f;
                  const auto parts =
                      usp_diagnostics_runtime_text::parts(
                          id(ui_language),
                          usp_diagnostics_runtime_text::Field::HEAP);

                  if (!std::isfinite(v)) {
                    return std::string(parts.prefix) + "--";
                  }

                  return std::string(parts.prefix)
                      + usp_ui::rounded_decimal(v) + parts.unit;

            - lvgl.label.update:
                id: diag_psram_label
                text: !lambda |-
                  const float v =
                      id(panel_psram_free).state
                      / 1024.0f;
                  const auto parts =
                      usp_diagnostics_runtime_text::parts(
                          id(ui_language),
                          usp_diagnostics_runtime_text::Field::PSRAM);

                  if (!std::isfinite(v)) {
                    return std::string(parts.prefix) + "--";
                  }

                  return std::string(parts.prefix)
                      + usp_ui::rounded_decimal(v) + parts.unit;

            - lvgl.label.update:
                id: backlight_value_label
                text: !lambda |-
                  const float v =
                      id(ui_backlight_percent);
                  const auto parts =
                      usp_diagnostics_runtime_text::parts(
                          id(ui_language),
                          usp_diagnostics_runtime_text::Field::BACKLIGHT);
                  return std::string(parts.prefix)
                      + usp_ui::rounded_decimal(v) + parts.unit;

time:
  - platform: sntp
    id: panel_time
    timezone: Europe/Kyiv
    on_time_sync:
      then:
        - lambda: |-
            const auto now = id(panel_time).now();
            id(clock_sntp_synced) = now.is_valid();
            if (now.is_valid()) {
              id(room_aggregate_history).confirm_time(
                  static_cast<uint32_t>(now.timestamp),
                  now.year, now.day_of_year, now.hour, true);
            }
        - script.execute: refresh_clock_time

debug:
  update_interval: 5s

sensor:
  # One shared RSSI sample feeds both LCD and the private Web projection.
  # UI refreshes must never call the Wi-Fi driver synchronously.
  - platform: wifi_signal
    id: panel_wifi_rssi
    internal: true
    update_interval: 15s
    on_value:
      - lambda: id(panel_wifi_rssi_valid) = std::isfinite(x);
      - script.execute: refresh_wifi_icon

  # Optional solderless SHT41/SHT45 module on the HY2.0-4P I2C connector.
  # Absence is a supported configuration and does not mark setup failed.
  - platform: usp_optional_sht4x
    id: environment_sht4x
    i2c_id: bus_a
    address: 0x44
    update_interval: 30s
    temperature:
      id: environment_temperature
      name: "Environment Temperature"
      on_value:
        - script.execute: refresh_optional_hardware_ui
        - script.execute: refresh_indoor_environment_ui
        - script.execute: schedule_room_current_refresh
    humidity:
      id: environment_humidity
      name: "Environment Humidity"
      on_value:
        - script.execute: refresh_optional_hardware_ui
        - script.execute: refresh_indoor_environment_ui
        - script.execute: schedule_room_current_refresh

  - platform: waveshare_io_ch32v003
    waveshare_io_ch32v003_id: wave_hub
    id: panel_battery_voltage
    name: "Panel Battery Voltage"
    reference_voltage: 9.9
    on_value:
      - lambda: id(home_native_frame_data_generation)++;
      - script.execute: refresh_battery_ui
      - if:
          condition:
            not:
              script.is_running: refresh_runtime_i18n
          then:
            - script.execute: refresh_runtime_i18n
    update_interval: 10s

  - platform: template
    id: panel_battery_level
    name: "Panel Battery Level"
    unit_of_measurement: "%"
    device_class: battery
    accuracy_decimals: 0
    update_interval: 10s
    lambda: |-
      if (!id(web_battery_installed).state) return NAN;
      return usp_battery_model::estimate_percent(id(panel_battery_voltage).state);

  - platform: uptime
    id: panel_uptime
    internal: true
    update_interval: 5s
    on_value:
      - if:
          condition:
            not:
              script.is_running: refresh_runtime_i18n
          then:
            - script.execute: refresh_runtime_i18n
  - platform: debug
    free:
      id: panel_heap_free
      internal: true
      on_value:
        - if:
            condition:
              not:
                script.is_running: refresh_runtime_i18n
            then:
              - script.execute: refresh_runtime_i18n
    psram:
      id: panel_psram_free
      internal: true
      on_value:
        - if:
            condition:
              not:
                script.is_running: refresh_runtime_i18n
            then:
              - script.execute: refresh_runtime_i18n

  - platform: template
    id: panel_loop_stack_headroom
    name: "Panel Loop Stack Headroom"
    entity_category: diagnostic
    unit_of_measurement: B
    accuracy_decimals: 0
    update_interval: 15s
    on_value:
      - script.execute: refresh_stack_i18n
    lambda: |-
      const auto headroom =
          uxTaskGetStackHighWaterMark(nullptr);
      static bool warned = false;

      if (headroom < 2048 && !warned) {
        ESP_LOGW(
            "usp.stack",
            "Loop task stack headroom low: %u B",
            static_cast<unsigned>(headroom));
        warned = true;
      }

      return static_cast<float>(headroom);

  - platform: template
    id: alert_data_age_seconds
    name: Alert Data Age
    entity_category: diagnostic
    unit_of_measurement: s
    accuracy_decimals: 0
    update_interval: 5s
    lambda: |-
      if (id(alert_live_last_update_ms) == 0) {
        return NAN;
      }

      const uint32_t age =
          static_cast<uint32_t>(
              millis() -
              id(alert_live_last_update_ms));

      return static_cast<float>(age) / 1000.0f;

  - platform: template
    id: alert_accepted_frames_sensor
    name: Alert Accepted Frames
    entity_category: diagnostic
    accuracy_decimals: 0
    update_interval: 5s
    lambda: |-
      return static_cast<float>(
          id(alert_live_accepted_frames));

  - platform: template
    id: alert_rejected_frames_sensor
    name: Alert Rejected Frames
    entity_category: diagnostic
    accuracy_decimals: 0
    update_interval: 5s
    lambda: |-
      return static_cast<float>(
          id(alert_live_rejected_frames));


