          then:
            - repeat:
                count: 9
                then:
                  - lambda: |-
                      if (iteration != 0U && usp_fullscreen_map_cache::Cache::instance().active()) return;
                      lv_obj_t *originals[] = {
                          id(full_map_region_ua_05), id(full_map_region_ua_07), id(full_map_region_ua_09), id(full_map_region_ua_12),
                          id(full_map_region_ua_14), id(full_map_region_ua_18), id(full_map_region_ua_21), id(full_map_region_ua_23),
                          id(full_map_region_ua_26), id(full_map_region_ua_32), id(full_map_region_ua_35), id(full_map_region_ua_43),
                          id(full_map_region_ua_46), id(full_map_region_ua_48), id(full_map_region_ua_51), id(full_map_region_ua_53),
                          id(full_map_region_ua_56), id(full_map_region_ua_59), id(full_map_region_ua_61), id(full_map_region_ua_63),
                          id(full_map_region_ua_65), id(full_map_region_ua_68), id(full_map_region_ua_71), id(full_map_region_ua_74),
                          id(full_map_region_ua_77), id(fullscreen_outline_tile_00), id(fullscreen_outline_tile_01), id(fullscreen_outline_tile_02),
                          id(fullscreen_outline_tile_03), id(fullscreen_outline_tile_04), id(fullscreen_outline_tile_05), id(fullscreen_outline_tile_06),
                          id(fullscreen_outline_tile_07), id(fullscreen_outline_tile_08), id(fullscreen_outline_tile_09), id(fullscreen_outline_tile_10),
                          id(fullscreen_outline_tile_11), id(fullscreen_outline_tile_12), id(fullscreen_outline_tile_13), id(fullscreen_outline_tile_14),
                          id(fullscreen_outline_tile_15), id(fullscreen_outline_tile_16), id(fullscreen_outline_tile_17), id(fullscreen_outline_tile_18),
                          id(fullscreen_outline_tile_19), id(fullscreen_outline_tile_20), id(fullscreen_outline_tile_21), id(fullscreen_outline_tile_22),
                          id(fullscreen_outline_tile_23), id(fullscreen_outline_tile_24), id(fullscreen_outline_tile_25), id(fullscreen_outline_tile_26),
                          id(fullscreen_outline_tile_27), id(fullscreen_outline_tile_28), id(fullscreen_outline_tile_29), id(fullscreen_outline_tile_30),
                          id(fullscreen_outline_tile_31), id(fullscreen_outline_tile_32), id(fullscreen_outline_tile_33), id(fullscreen_outline_tile_34),
                          id(fullscreen_outline_tile_35), id(fullscreen_outline_tile_36), id(fullscreen_outline_tile_37), id(fullscreen_outline_tile_38),
                          id(fullscreen_outline_tile_39), id(fullscreen_outline_tile_40), id(fullscreen_outline_tile_41),
                      };
                      if (iteration == 0U) {
                        const bool ready = usp_fullscreen_map_cache::Cache::instance().refresh(
                            id(fullscreen_map_touch_surface), originals, 67,
                            id(alert_render_states), id(ui_alert_palette));
                        if (usp_fullscreen_map_cache::Cache::instance().cold_pending())
                          id(prepare_fullscreen_map_cache).execute();
                        if (ready) return;
                      }
                      usp_fullscreen_map_cache::update_fallback(
                          originals, id(alert_render_states), id(ui_alert_palette), iteration);
                  - delay: 20ms
            - lvgl.label.update:
                id: fullscreen_alert_source_label
                text: !lambda |-
                  const uint8_t language = id(ui_language);
                  const uint8_t source = id(alert_map_source);
                  if (source == 2U) {
                    if (language == 0U) return std::string("NEPTUN · ОСНОВНЕ");
                    if (language == 1U) return std::string("NEPTUN · ОСНОВНОЙ");
                    return std::string("NEPTUN · PRIMARY");
                  }
                  if (source == 3U) {
                    const char *name = "API";
                    const bool live = id(alert_live_state) == 1U;
                    if (language == 0U) {
                      return std::string("Тривоги: ") + name
                          + (live ? " · АКТУАЛЬНО" : " · ЗАСТАРІЛО");
                    }
                    if (language == 1U) {
                      return std::string("Тревоги: ") + name
                          + (live ? " · АКТУАЛЬНО" : " · УСТАРЕЛО");
                    }
                    return std::string("Alerts: ") + name
                        + (live ? " · LIVE" : " · STALE");
                  }
                  if (id(alert_live_state) == 2U) {
                    if (language == 0U) return std::string("Тривоги: ЗАСТАРІЛО");
                    if (language == 1U) return std::string("Тревоги: УСТАРЕЛО");
                    return std::string("Alerts: STALE");
                  }
                  if (language == 0U) return std::string("Тривоги: НЕМАЄ ДАНИХ");
                  if (language == 1U) return std::string("Тревоги: НЕТ ДАННЫХ");
                  return std::string("Alerts: NO DATA");
            - lambda: |-
                uint32_t color = 0x90A4B8;
                if (id(alert_map_source) == 1U) color = 0xFACC15;
                else if (id(alert_map_source) != 0U && id(alert_live_state) == 1U)
                  color = 0x4ADE80;
                else if (id(alert_live_state) == 2U) color = 0xF59E0B;
                else if (id(alert_map_source) == 0U) color = 0xEF4444;
                lv_obj_set_style_text_color(
                    id(fullscreen_alert_source_label), lv_color_hex(color),
                    LV_PART_MAIN);

  - id: schedule_dashboard_alert_refresh
    mode: restart
    then:
      - delay: 10ms
      - if:
          condition:
            lambda: |-
              uint64_t signature = 1469598103934665603ULL;
              const auto mix = [&signature](uint8_t value) {
                signature ^= static_cast<uint64_t>(value);
                signature *= 1099511628211ULL;
              };
              mix(id(ui_language));
              mix(id(alert_live_state));
              const uint16_t region = id(ui_selected_region_id);
              mix(static_cast<uint8_t>(region & 0xFFU));
              mix(static_cast<uint8_t>((region >> 8U) & 0xFFU));
              for (size_t index = 0; index < 25; ++index) {
                mix(static_cast<uint8_t>(id(alert_render_states)[index]));
              }
              if (id(dashboard_alert_signature_valid)
                  && id(dashboard_alert_signature) == signature) {
                id(dashboard_alert_refresh_skips)++;
                return false;
              }
              id(dashboard_alert_signature) = signature;
              id(dashboard_alert_signature_valid) = true;
              id(dashboard_alert_refresh_hits)++;
              id(home_native_frame_data_generation)++;
              return true;
          then:
            - if:
                condition:
                  lvgl.page.is_showing:
                    id: page_home
                then:
                  - script.execute: refresh_dashboard_alert_ui

