            id(lcd_navigation_language) = language;
            id(panel_lvgl).invalidate_home_native_frame_cache();
          }
          const unsigned page = id(lcd_navigation_page);
          const unsigned pages[] = {0, 1, 2, 3, 4, 12, 9, 5};
          for (unsigned index = 0; index < 8; ++index) {
