  - id: refresh_fullscreen_threat_icons
    mode: restart
    then:
      - lambda: |-
          lv_obj_t *markers[] = {id(fullscreen_threat_marker_0), id(fullscreen_threat_marker_1), id(fullscreen_threat_marker_2), id(fullscreen_threat_marker_3), id(fullscreen_threat_marker_4), id(fullscreen_threat_marker_5), id(fullscreen_threat_marker_6), id(fullscreen_threat_marker_7), id(fullscreen_threat_marker_8), id(fullscreen_threat_marker_9), id(fullscreen_threat_marker_10), id(fullscreen_threat_marker_11)};
          esphome::lvgl::LvLineType *headings[] = {id(fullscreen_threat_heading_0), id(fullscreen_threat_heading_1), id(fullscreen_threat_heading_2), id(fullscreen_threat_heading_3), id(fullscreen_threat_heading_4), id(fullscreen_threat_heading_5), id(fullscreen_threat_heading_6), id(fullscreen_threat_heading_7), id(fullscreen_threat_heading_8), id(fullscreen_threat_heading_9), id(fullscreen_threat_heading_10), id(fullscreen_threat_heading_11)};
          static lv_point_precise_t heading_points[12][2];
          for (size_t index = 0; index < 12; ++index) {
            lv_obj_add_flag(markers[index], LV_OBJ_FLAG_HIDDEN);
            lv_obj_add_flag(headings[index]->obj, LV_OBJ_FLAG_HIDDEN);
          }
          // Keep the last successful threat points visible until stale_after.
          // last_fetch_ok is diagnostic state, not freshness authority.
          if (!id(neptun_client).valid() || id(neptun_client).stale()) return;
          const auto snapshot = id(neptun_client).snapshot();
          const size_t count = std::min<size_t>(snapshot.threat_point_count, 12);
          for (size_t index = 0; index < count; ++index) {
            const auto &point = snapshot.threat_points[index];
            int16_t x = 0, y = 0;
            if (!esphome::usp_neptun::threat_fullscreen_point(
                    point.latitude, point.longitude, &x, &y)) continue;
            const int marker_x = std::clamp<int>(x - 14, 0, 984 - 28);
            const int marker_y = std::clamp<int>(y - 12, 0, 516 - 24);
            lv_obj_set_pos(markers[index], marker_x, marker_y);
            lv_label_set_text(markers[index],
                usp_threat_icons_ui::label(point.kind, point.quality));
            const uint32_t semantic_color = usp_threat_icons_ui::color(
                point.kind, id(ui_alert_palette));
            lv_obj_set_style_border_color(
                markers[index], lv_color_hex(semantic_color), LV_PART_MAIN);
            lv_obj_set_style_text_color(
                markers[index], lv_color_hex(semantic_color), LV_PART_MAIN);
            lv_obj_clear_flag(markers[index], LV_OBJ_FLAG_HIDDEN);
            if (point.heading_deg < 0) continue;
            int16_t dx = 0, dy = 0;
            usp_threat_icons_ui::heading_delta(point.heading_deg, 20, &dx, &dy);
            heading_points[index][0] = {14, 12};
            heading_points[index][1] = {static_cast<int16_t>(14 + dx),
                                        static_cast<int16_t>(12 + dy)};
            lv_obj_set_pos(headings[index]->obj, marker_x, marker_y);
            lv_line_set_points(headings[index]->obj, heading_points[index], 2);
            lv_obj_set_style_line_color(
                headings[index]->obj, lv_color_hex(semantic_color), LV_PART_MAIN);
            lv_obj_clear_flag(headings[index]->obj, LV_OBJ_FLAG_HIDDEN);
          }

