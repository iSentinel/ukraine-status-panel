  - id: reveal_dashboard_home_startup
    mode: single
    then:
      - if:
          condition:
            lambda: return !id(dashboard_home_startup_revealed);
          then:
            # Do not guess when the first frame is complete. Wait until the
            # LVGL component has returned from its first lv_timer_handler().
            - wait_until:
                condition:
                  lambda: return id(panel_lvgl).has_completed_first_loop();
                timeout: 2s
            - lambda: |-
                ESP_LOGI(
                    "usp.home.startup",
                    "HOME_STARTUP_FIRST_PAINT_READY completed=%s",
                    YESNO(id(panel_lvgl).has_completed_first_loop()));
                lv_obj_clear_flag(id(dashboard_map_card), LV_OBJ_FLAG_HIDDEN);
                ESP_LOGI("usp.home.startup", "HOME_STARTUP_REVEAL card=map");
            - delay: 32ms
            - lambda: |-
                lv_obj_clear_flag(id(dashboard_alerts_card), LV_OBJ_FLAG_HIDDEN);
                ESP_LOGI("usp.home.startup", "HOME_STARTUP_REVEAL card=alerts");
            - delay: 32ms
            - lambda: |-
                lv_obj_clear_flag(id(dashboard_power_card), LV_OBJ_FLAG_HIDDEN);
                ESP_LOGI("usp.home.startup", "HOME_STARTUP_REVEAL card=power");
            - delay: 32ms
            - lambda: |-
                lv_obj_clear_flag(id(dashboard_history_card), LV_OBJ_FLAG_HIDDEN);
                ESP_LOGI("usp.home.startup", "HOME_STARTUP_REVEAL card=history");
            - delay: 32ms
            - lambda: |-
                lv_obj_clear_flag(id(dashboard_outage_card), LV_OBJ_FLAG_HIDDEN);
                id(dashboard_home_startup_revealed) = true;
                ESP_LOGI("usp.home.startup", "HOME_STARTUP_REVEAL_DONE");
            # Give the last card its own frame before any map mask is revealed.
            - delay: 40ms
            - script.execute: reveal_dashboard_map_startup
          else:
            # Returning to Home after startup must preserve the normal map
            # handoff/no-op behavior without hiding already-visible cards.
            - script.execute: reveal_dashboard_map_startup

  - id: reveal_dashboard_map_startup
    mode: single
    then:
      - if:
          condition:
            lambda: return !id(dashboard_map_startup_revealed);
          then:
            - if:
                condition:
                  lambda: return usp_dashboard_map_cache::Cache::instance().active();
                then:
                  - lambda: |-
                      id(dashboard_map_startup_revealed) = true;
                      ESP_LOGI("usp.map.startup", "MAP_STARTUP_REVEAL_DONE cache=dashboard");
                else:
                  # Low-PSRAM fallback preserves the proven staged legacy reveal.
                  - delay: 80ms
                  - repeat:
                      count: 25
                      then:
                        - lambda: |-
                            lv_obj_t *regions[25] = {
                                id(dash_region_ua_05), id(dash_region_ua_07),
                                id(dash_region_ua_09), id(dash_region_ua_12),
