  - id: refresh_shelly_power_ui
    mode: restart
    then:
      - delay: 1ms
      - lambda: |-
          std::string status;
          std::string detail;
          uint32_t color = 0xFACC15;
          if (!id(shelly_em_client).enabled()) {
            status = id(ui_language) == 0 ? "Shelly вимкнено"
                : (id(ui_language) == 1 ? "Shelly выключен" : "Shelly disabled");
            detail = "Shelly Pro EM-50";
          } else if (id(shelly_em_client).sequence() == 0) {
            status = id(ui_language) == 0 ? "ОЧІКУВАННЯ"
                : (id(ui_language) == 1 ? "ОЖИДАНИЕ" : "WAITING");
            detail = "Shelly Pro EM-50";
          } else if (id(shelly_em_client).auth_required()) {
            status = "SHELLY AUTH";
            detail = id(ui_language) == 0 ? "Потрібен пароль"
                : (id(ui_language) == 1 ? "Нужен пароль" : "Password required");
          } else if (!id(shelly_em_client).reachable()) {
            status = "SHELLY OFFLINE";
            detail = id(ui_language) == 0 ? "Пристрій недоступний"
                : (id(ui_language) == 1 ? "Устройство недоступно" : "Device unreachable");
          } else {
            const uint8_t index = id(shelly_mains_channel) == 1 ? 1 : 0;
            const auto channel = id(shelly_em_client).channel(index);
            if (!channel.valid) {
              status = "SHELLY ERROR";
              detail = "Shelly Pro EM-50";
              color = 0xF87171;
            } else {
              char first[48];
              char second[80];
              std::snprintf(first, sizeof(first), "%.1f V · %.0f W", channel.voltage, channel.act_power);
              std::snprintf(second, sizeof(second), "Shelly EM-50 · CH%u · %.2f Hz · PF %.2f",
                            static_cast<unsigned>(index), channel.freq, channel.pf);
              status = first;
              detail = second;
              color = channel.meter_error ? 0xF87171 : 0x4ADE80;
            }
          }
          lv_label_set_text(id(i18n_040), status.c_str());
          lv_obj_set_style_text_color(id(i18n_040), lv_color_hex(color), LV_PART_MAIN);
          lv_label_set_text(id(i18n_041), detail.c_str());
          lv_obj_send_event(id(i18n_040), lvgl::lv_update_event, nullptr);
          lv_obj_send_event(id(i18n_041), lvgl::lv_update_event, nullptr);
          uint32_t home_bg = 0x3A3012;
          if (color == 0x4ADE80) home_bg = 0x123B2A;
          if (color == 0xF87171) home_bg = 0x3B1820;
          lv_label_set_text(
              id(dashboard_shelly_summary_label), status.c_str());
          lv_obj_set_style_text_color(
              id(dashboard_shelly_summary_label),
              lv_color_hex(color), LV_PART_MAIN);
          lv_obj_set_style_bg_color(
              id(dashboard_shelly_summary_label),
              lv_color_hex(home_bg), LV_PART_MAIN);
          lv_obj_send_event(
              id(dashboard_shelly_summary_label),
              lvgl::lv_update_event, nullptr);

