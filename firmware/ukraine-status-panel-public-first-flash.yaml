            - lvgl.page.show:
                id: page_history
                animation: NONE
      - if:
          condition:
            lambda: return page == 5;
          then:
            - lvgl.page.show:
                id: page_settings
                animation: NONE

      - if:
          condition:
            lambda: return page == 12;
          then:
            - script.execute: refresh_spotify_ui
            - lvgl.page.show:
                id: page_spotify
                animation: NONE

      - if:
          condition:
            lambda: return page == 9;
          then:
            - lvgl.page.show:
                id: page_clock
                animation: NONE

      - if:
          condition:
            lambda: return page == 10;
          then:
            - lvgl.page.show:
                id: page_room
                animation: NONE

      - if:
          condition:
            lambda: return page == 11;
          then:
            - lvgl.page.show:
                id: page_alarms
                animation: NONE

  # M2 production fast-first-paint. fb0/fb1 remain LVGL DIRECT buffers; fb2 is
  # refreshed only after Home has settled and is presented before normal Home
  # page activation on the next return. A cache miss falls back to normal LVGL.
  - id: schedule_home_native_frame_cache
    mode: restart
    then:
      - delay: 900ms
      - if:
          condition:
            lvgl.page.is_showing:
              id: page_home
          then:
            - lambda: |-
                id(panel_lvgl).set_home_native_frame_context(
                    id(page_home).obj, id(lcd_navigation_menu),
                    id(alarm_notification));
                const auto now = id(panel_time).now();
                const uint32_t minute_key = now.is_valid()
                    ? static_cast<uint32_t>(now.year) * 535680U
                        + static_cast<uint32_t>(now.day_of_year) * 1440U
                        + static_cast<uint32_t>(now.hour) * 60U
                        + static_cast<uint32_t>(now.minute)
                    : 0xFFFFFFFFU;
                const uint64_t data_key =
                    (static_cast<uint64_t>(id(home_native_frame_data_generation)) << 32U)
                    | minute_key;
                id(panel_lvgl).set_home_native_frame_data_key(data_key);
                id(panel_lvgl).refresh_home_native_frame_cache();

  - id: show_home_fast
    mode: restart
    then:
      - lambda: |-
          id(panel_lvgl).set_home_native_frame_context(
              id(page_home).obj, id(lcd_navigation_menu),
              id(alarm_notification));
          const auto now = id(panel_time).now();
          const uint32_t minute_key = now.is_valid()
              ? static_cast<uint32_t>(now.year) * 535680U
                  + static_cast<uint32_t>(now.day_of_year) * 1440U
                  + static_cast<uint32_t>(now.hour) * 60U
                  + static_cast<uint32_t>(now.minute)
              : 0xFFFFFFFFU;
          const uint64_t data_key =
              (static_cast<uint64_t>(id(home_native_frame_data_generation)) << 32U)
              | minute_key;
          id(panel_lvgl).set_home_native_frame_data_key(data_key);
          const bool fast = id(panel_lvgl).present_home_native_frame_cache();
          ESP_LOGI("usp.home.fast", "HOME_FAST_NAV first_paint=%s", fast ? "CACHE" : "LVGL");
      - lvgl.page.show:
          id: page_home
          animation: NONE



  # Versioned shared setting mutation layer. Touchscreen, Native API and the
  # future local Web UI must call these setters instead of maintaining a
  # second settings store.
  - id: set_ui_language
    mode: restart
    parameters:
      language: int
    then:
      - if:
          condition:
            lambda: return language >= 0 && language <= 2;
          then:
            - if:
                condition:
                  lambda: |-
                    return id(ui_language) !=
                        static_cast<uint8_t>(language);
                then:
                  - lambda: id(ui_language) = static_cast<uint8_t>(language);
                  - script.execute: apply_ui_language
          else:
            - logger.log:
                tag: usp.settings
                level: WARN
                format: "Language rejected=%d"
                args: [language]

  - id: set_sound_enabled
    mode: restart
    parameters:
      enabled: bool
    then:
      - lambda: |-
          id(ui_sound_enabled) = enabled;
          ESP_LOGI("usp.sound", "Panel sound policy=%s", enabled ? "ON" : "OFF");
      - script.execute: refresh_sound_controls
      - script.execute: refresh_alarm_labels
      - script.execute: refresh_alarm_state

  - id: set_alarm_sound_enabled
    mode: restart
    parameters:
      enabled: bool
    then:
      - lambda: |-
          id(alarm_sound_enabled) = enabled;
          ESP_LOGI("usp.alarm", "Alarm sound policy=%s", enabled ? "ON" : "OFF");
      - if:
          condition:
            lambda: return !enabled;
          then:
            - script.stop: alarm_audio_loop
            - rtttl.stop:
                id: panel_buzzer
          else:
            - if:
                condition:
                  lambda: return id(personal_alarms).active();
                then:
                  - script.execute: alarm_audio_loop
      - script.execute: refresh_alarm_labels
      - script.execute: refresh_alarm_state

  - id: alarm_audio_loop
    mode: restart
    then:
      - while:
          condition:
            lambda: return id(personal_alarms).active() && id(alarm_sound_enabled);
          then:
            - logger.log:
                tag: usp.alarm
                format: "Personal alarm cadence pulse"
            - rtttl.play:
                id: panel_buzzer
                rtttl: "alarm:d=16,o=6,b=120:c,8p,c"
            - delay: 6s

  - id: play_buzzer_test
    mode: restart
    then:
      - logger.log:
          tag: usp.sound
          level: INFO
          format: "Explicit buzzer test requested"
      - rtttl.play:
