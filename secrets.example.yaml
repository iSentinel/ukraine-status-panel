# Copy to firmware/secrets.yaml for a private/local build.
# Replace every value before using this on real hardware. Never commit secrets.yaml.
wifi_ssid: "REPLACE_WITH_WIFI_SSID"
wifi_password: "REPLACE_WITH_WIFI_PASSWORD"
fallback_ap_password: "REPLACE_WITH_RANDOM_AP_PASSWORD"

# ESPHome Native API requires a base64-encoded 32-byte key.
api_encryption_key: "REPLACE_WITH_32_BYTE_BASE64_KEY"

# Local production Web UI uses HTTP Digest authentication.
web_server_password: "REPLACE_WITH_RANDOM_WEB_PASSWORD"

# Public Spotify application identifier; never put a Client Secret in firmware.
spotify_client_id: "0123456789abcdef0123456789abcdef"
