<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; connect-src 'none'; base-uri 'none'; form-action 'none'">
<title>Ukraine Status Panel — Spotify authorization</title>
<link rel="stylesheet" href="relay.css">
<script type="module" src="relay.js"></script>
</head>
<body>
<main>
<h1 id="title">Spotify authorization</h1>
<p id="status" role="status">Returning the result to your panel web page…</p>
<button id="manual-return" type="button" hidden>Return manually</button>
<section id="manual" hidden>
<label id="manual-label" for="result">Copy this result into the panel web page.</label>
<textarea id="result" readonly rows="5" spellcheck="false" autocomplete="off"></textarea>
<button id="copy" type="button">Copy result</button>
</section>
<p id="privacy">No password or verification secret is stored on this page.</p>
</main>
</body>
</html>
