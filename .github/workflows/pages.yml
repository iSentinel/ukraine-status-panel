name: Publish ESP Web Tools

on:
  # Publishing is manual and fail-closed until exact-version hardware acceptance.
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  validation:
    uses: ./.github/workflows/source-check.yml
    permissions:
      contents: read
  build-and-deploy:
    needs: validation
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements-ci.lock
            requirements-ci-bootstrap.lock
      - name: Install ESPHome
        run: bash scripts/install-ci-dependencies.sh
      - name: Regenerate public profile and manifest
        run: |
          python scripts/generate-public-first-flash.py firmware/ukraine-status-panel.yaml firmware/ukraine-status-panel-public-first-flash.yaml
          python scripts/generate-web-manifest.py firmware/ukraine-status-panel-public-first-flash.yaml web-installer/manifest.json
          python scripts/validate-web-manifest.py --acceptance-preflight
          git diff --exit-code -- firmware/ukraine-status-panel-public-first-flash.yaml web-installer/manifest.json
      - name: Read the accepted factory artifact
        id: accepted_factory
        run: python scripts/public-release-artifact.py --github-output "$GITHUB_OUTPUT"
      - name: Download the exact accepted factory image
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ steps.accepted_factory.outputs.run_id }}
          name: ${{ steps.accepted_factory.outputs.artifact_name }}
          path: _accepted
      - name: Stage Pages site
        run: |
          mkdir -p _site
          cp web-installer/index.html web-installer/manifest.json web-installer/release-status.json web-installer/README.md _site/
          factory="_accepted/firmware.factory.bin"
          test -f "$factory"
          cp "$factory" _site/firmware.factory.bin
          python scripts/validate-web-manifest.py --require-hardware-validated --site-dir _site --factory-image _site/firmware.factory.bin
          (cd _site && sha256sum firmware.factory.bin manifest.json release-status.json index.html README.md > SHA256SUMS)
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
