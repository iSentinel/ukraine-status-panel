name: Owner firmware approval (manual, no Ed25519)

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Exact installed release, e.g. 0.115.415-dev"
        type: string
        required: true
      receipt_sha256:
        description: "SHA256 of the original 24-proof receipt JSON"
        type: string
        required: true
      packet_sha256:
        description: "SHA256 of the original evidence archive"
        type: string
        required: true
      statement:
        description: "Type I APPROVE 0.115.415-dev AS OWNER"
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: owner-approval-firmware-415
  cancel-in-progress: false

jobs:
  owner-approval:
    if: >-
      github.repository == 'iSentinel/ukraine-status-panel' &&
      github.ref == 'refs/heads/main' &&
      github.actor == 'iSentinel' &&
      github.triggering_actor == 'iSentinel'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out approved release workflow
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install pinned logger
        run: python -m pip install --disable-pip-version-check loguru==0.7.3
      - name: Verify owner refusal tests
        run: python tests/owner-github-approval-native.py
      - name: Record explicit owner consent
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          RECEIPT_SHA256: ${{ inputs.receipt_sha256 }}
          PACKET_SHA256: ${{ inputs.packet_sha256 }}
          OWNER_STATEMENT: ${{ inputs.statement }}
        run: |
          mkdir -p "$RUNNER_TEMP/owner-decision"
          python scripts/owner-github-approval.py \
            --version "$RELEASE_VERSION" \
            --receipt-sha256 "$RECEIPT_SHA256" \
            --packet-sha256 "$PACKET_SHA256" \
            --statement "$OWNER_STATEMENT" \
            --output "$RUNNER_TEMP/owner-decision/receipt-v2-owner-approval.json"
      - name: Display owner approval hash
        run: |
          echo '### Owner Approval — not independently signed' >> "$GITHUB_STEP_SUMMARY"
          sha256sum "$RUNNER_TEMP/owner-decision/receipt-v2-owner-approval.json" >> "$GITHUB_STEP_SUMMARY"
          echo 'No firmware build, OTA, rollback or production apply was performed.' >> "$GITHUB_STEP_SUMMARY"
      - name: Retain owner declaration only
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: receipt-v2-owner-approval-0.115.415-dev
          path: ${{ runner.temp }}/owner-decision/receipt-v2-owner-approval.json
          if-no-files-found: error
          retention-days: 30
