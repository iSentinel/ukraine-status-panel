name: Release firmware

on:
  push:
    tags:
      - 'v*'

permissions:
  actions: read
  contents: write

jobs:
  validation:
    uses: ./.github/workflows/source-check.yml
    permissions:
      contents: read
  release:
    needs: validation
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements-ci.lock
            requirements-ci-bootstrap.lock
      - name: Install build dependencies
        run: bash scripts/install-ci-dependencies.sh
      - name: Validate source and release metadata
        run: |
          bash scripts/check-source.sh
          bash scripts/secret-scan.sh
          bash scripts/ci-config-check.sh
          python scripts/generate-public-first-flash.py firmware/ukraine-status-panel.yaml firmware/ukraine-status-panel-public-first-flash.yaml
          python scripts/generate-web-manifest.py firmware/ukraine-status-panel-public-first-flash.yaml web-installer/manifest.json
          python scripts/validate-web-manifest.py --acceptance-preflight
          git diff --exit-code -- firmware/ukraine-status-panel-public-first-flash.yaml web-installer/manifest.json
          version="$(python -c 'import json; print(json.load(open("web-installer/manifest.json"))["version"])')"
          test "$GITHUB_REF_NAME" = "v$version"
      - name: Read the accepted factory artifact
        id: accepted_factory
        run: python scripts/public-release-artifact.py --github-output "$GITHUB_OUTPUT"
      - name: Download the exact accepted factory image
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ steps.accepted_factory.outputs.run_id }}
          name: ${{ steps.accepted_factory.outputs.artifact_name }}
          path: _accepted
      - name: Build release assets
        run: |
          version="$(python -c 'import json; print(json.load(open("web-installer/manifest.json"))["version"])')"
          factory="_accepted/firmware.factory.bin"
          test -f "$factory"
          python scripts/validate-web-manifest.py --require-hardware-validated --factory-image "$factory"
          mkdir -p dist
          scripts/make-source-release.sh "$version" dist
          scripts/make-public-release.sh "$factory" dist
          (cd dist && sha256sum *.tar.gz > RELEASE_SHA256SUMS)
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --generate-notes
