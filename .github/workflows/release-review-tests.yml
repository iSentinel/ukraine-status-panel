name: Firmware review signer safety tests

on:
  pull_request:
    paths:
      - 'scripts/release-review/**'
      - 'tests/release-review-ci-native.py'
      - '.github/workflows/receipt-v2-independent-sign.yml'
      - '.github/workflows/release-review-tests.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/release-review/**'
      - 'tests/release-review-ci-native.py'
      - '.github/workflows/receipt-v2-independent-sign.yml'
      - '.github/workflows/release-review-tests.yml'

permissions:
  contents: read

jobs:
  review-safety:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install pinned test dependencies
        run: python -m pip install --disable-pip-version-check --no-input cryptography==46.0.3 loguru==0.7.3 pycodestyle==2.14.0
      - name: Run reviewer and signer safety tests
        run: |
          python tests/release-review-ci-native.py
          python -m compileall -q scripts/release-review tests/release-review-ci-native.py
          pycodestyle --max-line-length=88 scripts/release-review tests/release-review-ci-native.py
