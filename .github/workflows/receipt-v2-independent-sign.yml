name: Independent firmware receipt Ed25519 approval
# Never automatically sign a push, tag, PR, or a local development result.
on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: independent-firmware-v2-receipt
  cancel-in-progress: false

jobs:
  preflight:
    if: github.repository == 'iSentinel/ukraine-status-panel' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install pinned review dependencies
        run: python -m pip install --disable-pip-version-check --no-input cryptography==46.0.3 loguru==0.7.3
      - name: Validate release-review code
        run: |
          python tests/release-review-ci-native.py
          python scripts/release-review/verify_packet.py --help
          python scripts/release-review/github_approval.py --help
          python scripts/release-review/sign_approval.py --help
      - name: Record review boundary
        run: |
          echo '### Firmware .415 — separate human reviewer required' >> "$GITHUB_STEP_SUMMARY"
          echo 'Independently inspect the 24 original proof files and their SHA256 values.' >> "$GITHUB_STEP_SUMMARY"
          echo 'A protected signer must wait for approval from a different GitHub user.' >> "$GITHUB_STEP_SUMMARY"

  protected-sign:
    needs: preflight
    environment: firmware-ed25519-review
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install pinned signer dependencies
        run: python -m pip install --disable-pip-version-check --no-input cryptography==46.0.3 loguru==0.7.3
      - name: Verify real independent GitHub environment reviewer
        env:
          GITHUB_TOKEN: ${{ github.token }}
          USP_REVIEWER_LOGIN: ${{ vars.USP_REVIEWER_LOGIN }}
          ORIGINAL_ACTOR: ${{ github.actor }}
          RERUN_ACTOR: ${{ github.triggering_actor }}
          RELEASE_RUN_ID: ${{ github.run_id }}
        run: |
          python scripts/release-review/github_approval.py \
            --run-id "$RELEASE_RUN_ID" \
            --actor "$ORIGINAL_ACTOR" \
            --rerun-actor "$RERUN_ACTOR" \
            --output "$RUNNER_TEMP/confirmed-reviewer.json"
      - name: Verify pinned original packet and 24 SHA256 proofs
        env:
          USP_REVIEW_PACKET_URL: ${{ secrets.USP_REVIEW_PACKET_URL }}
        run: |
          python scripts/release-review/verify_packet.py \
            --output-draft "$RUNNER_TEMP/reconciliation-receipt-draft.json"
      - name: Sign one independently reviewed release
        env:
          USP_REVIEW_SIGNING_KEY_B64: ${{ secrets.USP_REVIEW_SIGNING_KEY_B64 }}
          USP_REVIEW_PUBLIC_KEY_SHA256: ${{ vars.USP_REVIEW_PUBLIC_KEY_SHA256 }}
        run: |
          mkdir -p "$RUNNER_TEMP/signed-output"
          python scripts/release-review/sign_approval.py \
            --draft "$RUNNER_TEMP/reconciliation-receipt-draft.json" \
            --reviewer-json "$RUNNER_TEMP/confirmed-reviewer.json" \
            --output "$RUNNER_TEMP/signed-output/receipt-v2-signed-approval.json"
      - name: Publish safe approval digest
        run: |
          echo '### Signed .415 receipt — not a production promotion' >> "$GITHUB_STEP_SUMMARY"
          sha256sum "$RUNNER_TEMP/signed-output/receipt-v2-signed-approval.json" >> "$GITHUB_STEP_SUMMARY"
          echo 'Verify the trusted public key out of band before importing the approval.' >> "$GITHUB_STEP_SUMMARY"
      - name: Export signed JSON only, never evidence or secrets
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: receipt-v2-signed-approval-0.115.415-dev
          path: ${{ runner.temp }}/signed-output/receipt-v2-signed-approval.json
          if-no-files-found: error
          retention-days: 30
