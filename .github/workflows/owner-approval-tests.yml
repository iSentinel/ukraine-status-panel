name: Owner approval policy tests

on:
  pull_request:
    paths:
      - 'scripts/owner-github-approval.py'
      - 'tests/owner-github-approval-native.py'
      - '.github/workflows/owner-approval.yml'
      - '.github/workflows/owner-approval-tests.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/owner-github-approval.py'
      - 'tests/owner-github-approval-native.py'
      - '.github/workflows/owner-approval.yml'
      - '.github/workflows/owner-approval-tests.yml'

permissions:
  contents: read

jobs:
  owner-approval-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install pinned QA requirements
        run: python -m pip install --disable-pip-version-check loguru==0.7.3 pycodestyle==2.14.0
      - name: Validate owner approval and style
        run: |
          python -B tests/owner-github-approval-native.py
          python scripts/owner-github-approval.py --help
          python -m py_compile scripts/owner-github-approval.py tests/owner-github-approval-native.py
          pycodestyle --max-line-length=88 scripts/owner-github-approval.py tests/owner-github-approval-native.py
