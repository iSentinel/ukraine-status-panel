name: Source integrity
on:
  push:
  pull_request:
  workflow_call:
  workflow_dispatch:
    inputs:
      build_public_candidate:
        description: Build and retain a new public factory candidate after checks
        type: boolean
        default: false

jobs:
  source-check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements-ci.lock
            requirements-ci-bootstrap.lock
      - name: Install ESPHome and QA dependencies
        run: |
          bash scripts/install-ci-dependencies.sh
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tools/web-ui/package-lock.json
      - name: Install locked Web build and browser tools
        run: |
          npm ci --prefix tools/web-ui --ignore-scripts --no-audit --no-fund
          node tools/web-ui/node_modules/playwright/cli.js install --with-deps chromium
      - name: Validate embedded Web assets and real-browser forms
        run: |
          python scripts/build-web-ui.py --check
          bash scripts/test-web-forms.sh
          bash scripts/test-web-layout.sh
          python tests/web-installer-design-static.py
          node tests/web-installer-design-browser.cjs
          node tests/captive-portal-ui-browser.cjs
      - name: Verify guarded production input fingerprint (read-only)
        run: |
          PYTHON_BIN=python ./scripts/compile-production.sh --fingerprint
      - name: Test weather data integrity with pinned ArduinoJson
        run: |
          git init "$RUNNER_TEMP/usp-arduinojson"
          git -C "$RUNNER_TEMP/usp-arduinojson" fetch --depth 1 https://github.com/bblanchon/ArduinoJson.git 77771d3c07668e01d8f52acb03910c1110bb373f
          git -C "$RUNNER_TEMP/usp-arduinojson" checkout --detach FETCH_HEAD
          USP_ARDUINOJSON_INCLUDE="$RUNNER_TEMP/usp-arduinojson/src" python tests/weather-integrity-native.py
      - name: Prepare pinned native test libraries
        run: |
          git init "$RUNNER_TEMP/usp-lvgl"
          git -C "$RUNNER_TEMP/usp-lvgl" fetch --depth 1 https://github.com/lvgl/lvgl.git 85aa60d18b3d5e5588d7b247abf90198f07c8a63
          git -C "$RUNNER_TEMP/usp-lvgl" checkout --detach FETCH_HEAD
      - name: Generate real source for font and layout tests (no image)
        run: bash scripts/ci-generate-source.sh
      - name: Run complete offline regression
        env:
          USP_RUN_LIVE: '0'
          USP_RUN_BROWSER: '0'
        run: |
          export USP_ARDUINOJSON_INCLUDE="$RUNNER_TEMP/usp-arduinojson/src"
          export USP_LVGL_ROOT="$RUNNER_TEMP/usp-lvgl"
          # Keep the pinned CI dependencies visible at the ESPHome layout
          # expected by strict native tests; do not build or flash an image.
          native_dir="firmware/.esphome/build/ukraine-status-panel/managed_components"
          mkdir -p "$native_dir"
          test -f "$USP_ARDUINOJSON_INCLUDE/ArduinoJson.h"
          test -f "$RUNNER_TEMP/usp-arduinojson/library.json"
          test -f "$USP_LVGL_ROOT/lvgl.h"
          python -c 'import json,os,pathlib; p=pathlib.Path(os.environ["USP_ARDUINOJSON_INCLUDE"]).parent/"library.json"; assert json.loads(p.read_text())["version"]=="7.4.3"'
          test ! -e "$native_dir/bblanchon__arduinojson"
          test ! -e "$native_dir/lvgl__lvgl"
          ln -s "$RUNNER_TEMP/usp-arduinojson" "$native_dir/bblanchon__arduinojson"
          ln -s "$USP_LVGL_ROOT" "$native_dir/lvgl__lvgl"
          bash scripts/run-regression.sh
      - name: Check repository structure
        run: bash scripts/check-source.sh
      - name: Scan tracked files for secrets
        run: bash scripts/secret-scan.sh
      - name: Validate shared, ordinary and public profiles with CI-only credentials
        run: bash scripts/ci-config-check.sh
      - name: Validate ESP Web Tools manifest and release-status consistency
        run: python scripts/validate-web-manifest.py
      - name: Build a public factory candidate after all checks
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.build_public_candidate }}
        run: |
          esphome compile firmware/ukraine-status-panel-public-first-flash.yaml
          factory="$(find firmware/.esphome/build/ukraine-status-panel-public-first-flash -type f -name firmware.factory.bin -print -quit)"
          test -f "$factory"
          mkdir -p _candidate
          cp "$factory" _candidate/firmware.factory.bin
          python scripts/record-public-candidate.py _candidate/firmware.factory.bin _candidate/candidate.json
      - name: Retain the exact public candidate
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.build_public_candidate }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: public-first-flash-${{ github.run_id }}
          path: _candidate/
          if-no-files-found: error
          retention-days: 90
