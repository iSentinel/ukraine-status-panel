name: Bootstrap public source snapshot

on:
  push:
    branches: [main]
    paths:
      - bootstrap/usp-snapshot.part-00
      - bootstrap/usp-snapshot.part-01

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reassemble, verify and unpack cleaned snapshot
        shell: bash
        run: |
          set -euo pipefail
          cat bootstrap/usp-snapshot.part-00 \
              bootstrap/usp-snapshot.part-01 > /tmp/ukraine-status-panel-public.tar.xz
          echo "989b43affdfe8ca3557345a8ff601acdf449d2e0fc72b0ebd47d285d57b53f32  /tmp/ukraine-status-panel-public.tar.xz" | sha256sum -c -
          tar -tJf /tmp/ukraine-status-panel-public.tar.xz >/dev/null
          tar -xJf /tmp/ukraine-status-panel-public.tar.xz -C .
          rm -rf bootstrap

      - name: Publish source tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Snapshot already matches repository"
            exit 0
          fi
          git commit -m "feat: publish initial cleaned source snapshot"
          git push origin HEAD:main
